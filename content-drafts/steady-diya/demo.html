<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171829">
  <title>Steady diya · motion sketch</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #171829; color: #f7e9c9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.25rem; }
    main { width: min(100%, 28rem); text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 .3rem; }
    p { margin: .5rem 0 1rem; }
    .scene { position: relative; display: grid; place-items: center; height: 18rem; overflow: hidden;
      border: 1px solid #70644f; border-radius: 1.4rem; background: radial-gradient(circle at 50% 70%, #40301e, #171829 65%); }
    .diya { position: relative; width: 10rem; height: 11rem; display: grid; justify-items: center; align-content: end; }
    .glow { position: absolute; bottom: 3.8rem; width: 8rem; height: 8rem; border-radius: 50%;
      background: #f6a52f55; filter: blur(1.8rem); opacity: calc(.6 + var(--flicker, 0) * .2); }
    .flame { position: relative; z-index: 1; width: 3.2rem; height: 5rem; margin-bottom: -.6rem;
      border-radius: 80% 0 70% 45%; background: linear-gradient(40deg, #e67b25 25%, #ffca54 65%, #fff3b2);
      box-shadow: 0 0 1.5rem #fba73688; transform-origin: 50% 90%;
      transform: translateX(var(--lean, 0px)) rotate(var(--tilt, 0deg))
        scaleX(calc(1 + var(--flicker, 0) * .15)) scaleY(calc(1 - var(--flicker, 0) * .13));
      transition: transform 180ms ease-out; }
    .bowl { z-index: 2; width: 9rem; height: 2.8rem; border-radius: 12% 12% 65% 65%;
      background: linear-gradient(#c96a32, #813923); border-top: .45rem solid #e9a05d; }
    .controls { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
    button { border: 1px solid #dfa960; background: #39291c; color: #fff1d3; border-radius: .8rem;
      padding: .75rem 1rem; font: inherit; min-height: 2.8rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffdb83; outline-offset: 3px; }
    button:disabled { opacity: .45; }
    #status { min-height: 3rem; color: #e7d6b5; }
    small { display: block; color: #c5bba8; }
    @media (prefers-reduced-motion: reduce) { .flame { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Steady diya</h1>
    <p>A motion sketch. The flame stays lit.</p>
    <div class="scene" aria-label="A lit diya whose flame responds gently to phone movement">
      <div class="diya">
        <div class="glow"></div>
        <div class="flame"></div>
        <div class="bowl"></div>
      </div>
    </div>
    <div class="controls">
      <button id="start" type="button">Use motion</button>
      <button id="stop" type="button" disabled>Stop</button>
      <button id="preview" type="button">Preview flicker</button>
    </div>
    <p id="status" role="status" aria-live="polite">Set the phone on a safe surface, or hold it. Tap Use motion.</p>
    <small>18+. This is a visual toy, not a form check. No scores or timers. Motion needs HTTPS and a supported phone browser.</small>
  </main>
  <script>
    const scene = document.querySelector('.scene');
    const status = document.querySelector('#status');
    const startButton = document.querySelector('#start');
    const stopButton = document.querySelector('#stop');
    const previewButton = document.querySelector('#preview');
    let samples = [];
    let listening = false;
    let lastEvent = 0;
    let source = '';
    let previewTimeout;

    // Same prototype constants and window calculation as jerk.ts.
    function flameFrames(trace) {
      let filtered;
      let previousTime;
      const window = [];
      let result = { flicker: 0 };
      for (const sample of trace) {
        const { timeMs, x, y, z } = sample;
        const dtMs = previousTime === undefined ? 0 : timeMs - previousTime;
        if (dtMs <= 0 || dtMs > 200 || !filtered) {
          filtered = { x, y, z };
          previousTime = timeMs;
          window.length = 0;
          result = { flicker: 0 };
          continue;
        }
        const alpha = dtMs / (60 + dtMs);
        const next = {
          x: filtered.x + alpha * (x - filtered.x),
          y: filtered.y + alpha * (y - filtered.y),
          z: filtered.z + alpha * (z - filtered.z),
        };
        const dt = dtMs / 1000;
        const jerkSquared = ((next.x - filtered.x) / dt) ** 2 +
          ((next.y - filtered.y) / dt) ** 2 + ((next.z - filtered.z) / dt) ** 2;
        window.push({ timeMs, jerkSquared });
        while (window.length && timeMs - window[0].timeMs > 400) window.shift();
        const ready = window.length >= 8 && timeMs - window[0].timeMs >= 300;
        const rms = Math.sqrt(window.reduce((sum, item) => sum + item.jerkSquared, 0) / window.length);
        result = { flicker: ready ? Math.min(1, Math.max(0, (rms - 3) / 12)) : 0 };
        filtered = next;
        previousTime = timeMs;
      }
      return result;
    }

    function show(flicker, lean) {
      scene.style.setProperty('--flicker', String(flicker));
      scene.style.setProperty('--lean', String(lean) + 'px');
      scene.style.setProperty('--tilt', String(lean * .5) + 'deg');
    }

    function onMotion(event) {
      const direct = event.acceleration;
      const gravity = event.accelerationIncludingGravity;
      const valid = value => value && [value.x, value.y, value.z].every(Number.isFinite);
      const nextSource = valid(direct) ? 'linear' : valid(gravity) ? 'gravity' : '';
      if (!nextSource) return;
      if (nextSource !== source) { samples = []; source = nextSource; }
      const value = nextSource === 'linear' ? direct : gravity;
      const timeMs = event.timeStamp;
      samples.push({ timeMs, x: value.x, y: value.y, z: value.z });
      if (samples.length > 32) samples.shift();
      lastEvent = performance.now();
      const { flicker } = flameFrames(samples);
      show(flicker, Math.max(-12, Math.min(12, value.x * 2)));
      status.textContent = nextSource === 'linear'
        ? 'Motion is on. Move the phone gently to see the flame respond.'
        : 'Motion is on. This phone supplies gravity-included data, so tilting also changes the flame.';
    }

    function stop(message) {
      window.removeEventListener('devicemotion', onMotion);
      listening = false;
      samples = [];
      source = '';
      show(0, 0);
      startButton.disabled = false;
      stopButton.disabled = true;
      status.textContent = message;
    }

    startButton.addEventListener('click', async () => {
      if (!window.isSecureContext) {
        status.textContent = 'Motion needs HTTPS or localhost. Open this page from a secure server.';
        return;
      }
      if (!('DeviceMotionEvent' in window)) {
        status.textContent = 'Motion events are unavailable here. You can still preview the flame.';
        return;
      }
      try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== 'granted') {
            status.textContent = 'Motion access was not granted. You can still preview the flame.';
            return;
          }
        }
        window.addEventListener('devicemotion', onMotion);
        listening = true;
        lastEvent = performance.now();
        startButton.disabled = true;
        stopButton.disabled = false;
        status.textContent = 'Waiting for motion data…';
      } catch {
        status.textContent = 'Motion access is unavailable. You can still preview the flame.';
      }
    });

    stopButton.addEventListener('click', () => stop('Motion stopped. The flame is calm.'));
    previewButton.addEventListener('click', () => {
      if (listening) stop('Preview mode. Motion stopped.');
      clearTimeout(previewTimeout);
      show(.8, 7);
      status.textContent = 'Preview: the flame flickers and stays lit.';
      previewTimeout = setTimeout(() => show(0, 0), 900);
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && listening) stop('Motion paused while the page is hidden. Tap Use motion to resume.');
    });
    window.addEventListener('pagehide', () => {
      if (listening) stop('Motion stopped.');
    });
    setInterval(() => {
      if (listening && performance.now() - lastEvent > 2000) {
        stop('No motion data is arriving. Check permission and keep this page visible.');
      }
    }, 1000);
  </script>
</body>
</html>
