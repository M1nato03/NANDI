<title>Prime Pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f1f2f6; --surface:#ffffff; --sunk:#e7e9f0; --ink:#121827; --muted:#596277; --line:#dadde7;
  --good:#17784a; --good-soft:#dff2e7; --bad:#b3362a; --bad-soft:#f9e4e1; --tell:#e3a21a; --tell-soft:#fdf1d6;
  --c-recall:#5b45c7; --c-recall-soft:#ece8fb;
  --c-people:#a95d06; --c-people-soft:#fbeed8;
  --c-spot:#2459a8; --c-spot-soft:#e1eaf8;
  --c-mystery:#a8233a; --c-mystery-soft:#f9e3e7;
  --c-teaser:#17704a; --c-teaser-soft:#dcf1e5;
  --bubble-them:#e9ebf1; --bubble-me:#2459a8; --bubble-me-ink:#ffffff;
  --c-gita:#b4540c; --c-gita-soft:#fbe9d9; --c-charaka:#15724f; --c-charaka-soft:#dcf1e6; --c-pz:#2459a8; --c-pz-soft:#e1eaf8;
  --accent:var(--c-spot); --accent-soft:var(--c-spot-soft);
  --sun:#e09a10; --moon:#4f63a3; --path:rgba(36,89,168,.32);
  --r0:#f4c9c4; --r1:#fbe2a6; --r2:#cde6c2; --r3:#c5daf4; --r4:#e0d0f2; --r5:#f8cfe4; --r6:#c6ebe6; --r7:#e8dfcf; --r8:#d6dbe6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1120; --surface:#151b2c; --sunk:#1d2438; --ink:#e8ebf3; --muted:#9aa3b9; --line:#283149;
    --good:#4fc78d; --good-soft:#12301f; --bad:#f07468; --bad-soft:#3b1815; --tell:#f2b84b; --tell-soft:#3a2c0e;
    --c-recall:#a998f7; --c-recall-soft:#241e47;
    --c-people:#f2a948; --c-people-soft:#36280f;
    --c-spot:#82aaec; --c-spot-soft:#17233b;
    --c-mystery:#f27d90; --c-mystery-soft:#3b1720;
    --c-teaser:#62d29b; --c-teaser-soft:#12301f;
    --bubble-them:#232b42; --bubble-me:#3567b5; --bubble-me-ink:#ffffff;
  --c-gita:#f5a462; --c-gita-soft:#3a2412; --c-charaka:#5fd0a0; --c-charaka-soft:#11301f; --c-pz:#82aaec; --c-pz-soft:#17233b;
  --sun:#f5bd4f; --moon:#a8b7ee; --path:rgba(130,170,236,.38);
  --r0:#5b2f2b; --r1:#5a4719; --r2:#2d4a28; --r3:#223b5e; --r4:#3c2d58; --r5:#582d49; --r6:#1b4a45; --r7:#4a4232; --r8:#353b4b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1120; --surface:#151b2c; --sunk:#1d2438; --ink:#e8ebf3; --muted:#9aa3b9; --line:#283149;
  --good:#4fc78d; --good-soft:#12301f; --bad:#f07468; --bad-soft:#3b1815; --tell:#f2b84b; --tell-soft:#3a2c0e;
  --c-recall:#a998f7; --c-recall-soft:#241e47;
  --c-people:#f2a948; --c-people-soft:#36280f;
  --c-spot:#82aaec; --c-spot-soft:#17233b;
  --c-mystery:#f27d90; --c-mystery-soft:#3b1720;
  --c-teaser:#62d29b; --c-teaser-soft:#12301f;
  --bubble-them:#232b42; --bubble-me:#3567b5; --bubble-me-ink:#ffffff;
  --c-gita:#f5a462; --c-gita-soft:#3a2412; --c-charaka:#5fd0a0; --c-charaka-soft:#11301f; --c-pz:#82aaec; --c-pz-soft:#17233b;
  --sun:#f5bd4f; --moon:#a8b7ee; --path:rgba(130,170,236,.38);
  --r0:#5b2f2b; --r1:#5a4719; --r2:#2d4a28; --r3:#223b5e; --r4:#3c2d58; --r5:#582d49; --r6:#1b4a45; --r7:#4a4232; --r8:#353b4b;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible{outline:2px solid var(--c-spot);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(var(--tabh) + 96px + env(safe-area-inset-bottom,0px))}
.eyebrow{font:500 .7rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font:800 1.15rem/1 var(--display);letter-spacing:-.02em}
.brand span{color:var(--muted);font-weight:600}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .78rem/1 var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.hot{border-color:var(--c-people);color:var(--c-people)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.seg i{height:4px;border-radius:2px;background:var(--sunk);display:block}
.seg i.ok{background:var(--good)} .seg i.no{background:var(--bad)} .seg i.now{background:var(--ink)}
.combo{font:600 .75rem/1 var(--mono);color:var(--c-people)}
.status{font:500 .8rem/1.35 var(--mono);color:var(--c-people);padding:8px 12px;border:1px dashed var(--c-people);border-radius:10px;margin-bottom:12px}

/* card */
.stage{display:grid;gap:14px}
.enter{animation:rise .22s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.card-head{display:flex;align-items:center;gap:8px}
.tpill{display:inline-flex;align-items:center;gap:6px;font:600 .74rem/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:8px}
.tpill svg{width:15px;height:15px}
.t-recall .tpill{background:var(--c-recall-soft);color:var(--c-recall)}
.t-people .tpill{background:var(--c-people-soft);color:var(--c-people)}
.t-spot .tpill{background:var(--c-spot-soft);color:var(--c-spot)}
.t-mystery .tpill{background:var(--c-mystery-soft);color:var(--c-mystery)}
.t-teaser .tpill{background:var(--c-teaser-soft);color:var(--c-teaser)}
.lawtag{font:500 .74rem/1 var(--mono);color:var(--muted)}
.flag{margin-left:auto;background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.flag svg{width:18px;height:18px}
.flagbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;background:var(--sunk);border-radius:10px;padding:10px 12px}
.flagbox button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem}
.scene{font:500 .78rem/1.2 var(--mono);color:var(--muted)}
.text{font-size:1.06rem;line-height:1.6}
.text.big{font:600 1.22rem/1.45 var(--display)}
.q{font:700 1.08rem/1.35 var(--display)}
.prompt{font:700 1.35rem/1.35 var(--display);padding-block:8px}
.think{font-size:.88rem;color:var(--muted)}
.answer{border-top:1px dashed var(--line);padding-top:14px;font-size:1.08rem;line-height:1.6}

/* options */
.opts{display:grid;gap:9px}
.opts.grid2{grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;cursor:pointer;line-height:1.45;font-size:.98rem;min-height:52px}
.opts.grid2 .opt{grid-template-columns:1fr;text-align:center;justify-items:center;font:600 1.12rem/1.2 var(--display);padding:16px 10px}
.opts.grid2 .opt .key{display:none}
.opt .key{font:600 .78rem/1 var(--mono);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.hintbtn{justify-self:start;background:none;border:1px dashed var(--line);border-radius:999px;padding:7px 12px;font-size:.85rem;color:var(--muted);cursor:pointer}
.hint{font-size:.92rem;background:var(--sunk);border-radius:10px;padding:10px 12px}

/* feedback */
.fb{border-radius:14px;padding:14px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb .verdict{font:800 1.2rem/1.1 var(--display)}
.fb.ok .verdict{color:var(--good)} .fb.no .verdict{color:var(--bad)}
.fb .meta{display:flex;gap:10px;flex-wrap:wrap;font:500 .76rem/1.2 var(--mono);color:var(--muted)}

/* chat */
.phone{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.phone-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 .95rem/1 var(--display);background:var(--c-spot-soft);color:var(--c-spot);flex:none}
.phone-head b{display:block;font-size:.95rem;line-height:1.2}
.phone-head small{color:var(--muted);font-size:.78rem}
.msgs{display:flex;flex-direction:column;gap:7px;padding:12px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:.95rem;line-height:1.4;position:relative;overflow-wrap:anywhere}
.bub.t{align-self:flex-start;background:var(--bubble-them);border-bottom-left-radius:5px}
.bub.m{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:5px}
.bub.tell{box-shadow:0 0 0 3px var(--tell)}
.telltag{font:600 .68rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--tell);margin-top:-2px}
.telltag.t{align-self:flex-start;margin-left:6px} .telltag.m{align-self:flex-end;margin-right:6px}
.day{align-self:center;font:500 .7rem/1 var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 9px}

/* mystery */
.clues{list-style:none;margin:0;padding:0;display:grid;gap:7px;counter-reset:c}
.clues li{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:.95rem;line-height:1.45}
.clues li::before{counter-increment:c;content:counter(c);font:600 .72rem/1 var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--c-mystery-soft);color:var(--c-mystery);margin-top:1px}

/* action bar */
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px}
.actionbar .in{max-width:528px;margin:0 auto;display:grid;gap:8px;grid-auto-flow:column;grid-auto-columns:1fr}
.btn{border-radius:14px;padding:14px 16px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);font-weight:600;font-size:1rem;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.miss{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.got{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.swipehint{font:500 .7rem/1 var(--mono);color:var(--muted);text-align:center}

.sheet{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 71px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 24px rgba(10,15,30,.14);max-height:44vh;overflow:auto;padding:12px 16px}
.sheet .in{max-width:528px;margin:0 auto;display:grid;gap:10px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;color:var(--muted);font:600 .74rem/1 var(--body);cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab{position:relative}
.tab .dot{position:absolute;top:9px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--c-mystery)}
.ic{display:inline-flex;line-height:0}

/* end screen */
.end{display:grid;gap:16px;justify-items:stretch}
.end-top{display:grid;justify-items:center;gap:8px;text-align:center;padding-top:6px}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font:800 2rem/1 var(--display)}
.ring .num small{display:block;font:500 .72rem/1 var(--mono);color:var(--muted);margin-top:4px}
.ratings{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.rate b{font:700 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums}
.delta{font:600 .8rem/1 var(--mono)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}
.note{border-radius:14px;padding:12px 14px;background:var(--c-recall-soft);color:var(--ink);font-size:.95rem}
.note b{font-family:var(--display)}
details.review{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
details.review summary{cursor:pointer;font-weight:600}
.misses{display:grid;gap:12px;margin-top:12px}
.miss{display:grid;gap:4px;font-size:.92rem;border-top:1px solid var(--line);padding-top:10px}
.miss b{font-family:var(--display)}
.genbox{display:grid;gap:8px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:.92rem}

/* cases */
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:14px}
.case-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font:600 .72rem/1 var(--mono);padding:5px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.pill.easy{background:var(--good-soft);color:var(--good)} .pill.medium{background:var(--c-people-soft);color:var(--c-people)} .pill.hard{background:var(--c-mystery-soft);color:var(--c-mystery)}
.pill.done{background:var(--good);color:var(--surface)}
.suspects{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sus{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--bg)}
.sus .avatar{background:var(--c-mystery-soft);color:var(--c-mystery)}
.sus b{display:block;font-size:.92rem;line-height:1.15}
.sus small{color:var(--muted);font-size:.76rem}
.inv{display:grid;gap:6px;font-size:.9rem}
.inv span{color:var(--muted)}
.howto{background:var(--sunk);border-radius:12px;padding:12px 14px;font-size:.92rem;display:grid;gap:6px}
.howto summary{cursor:pointer;font-weight:600}
.cluelist{list-style:none;margin:0;padding:0;display:grid;gap:6px;counter-reset:c}
.cluelist li button{display:grid;grid-template-columns:26px 1fr;gap:8px;text-align:left;width:100%;background:none;border:0;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:.97rem;line-height:1.45}
.cluelist li button::before{counter-increment:c;content:counter(c);font:600 .72rem/1 var(--mono);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--c-mystery-soft);color:var(--c-mystery);margin-top:1px}
.cluelist li.struck button{color:var(--muted);text-decoration:line-through}
.key-clue{border:1.5px solid var(--c-mystery);border-radius:12px;padding:10px 12px;font-size:.97rem}
.key-clue b{color:var(--c-mystery);font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:4px}
.gridwrap{display:grid;gap:6px}
.gridwrap h3{font-size:.95rem}
.lg{display:grid;gap:3px;align-items:stretch}
.lg .ch{font:600 .74rem/1.15 var(--body);color:var(--muted);text-align:center;display:flex;align-items:flex-end;justify-content:center;padding:0 2px 4px;overflow-wrap:anywhere;hyphens:auto}
.lg .rh{font-size:.84rem;font-weight:600;display:flex;align-items:center;padding-right:6px;line-height:1.15;overflow-wrap:anywhere}
.cell{height:44px;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;cursor:pointer;display:grid;place-items:center;font:700 1.15rem/1 var(--display);padding:0}
.cell.x{color:var(--bad)} .cell.ax{color:var(--muted);opacity:.6;font-weight:500} .cell.v{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.cell.err{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad)}
.cell.clash{border-color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:.86rem;cursor:pointer}
.accuse{display:grid;gap:10px}
.accuse .row{display:grid;gap:6px}
.accuse .row > span{font:500 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:.92rem;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--c-mystery);background:var(--c-mystery-soft);color:var(--c-mystery);font-weight:600}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:.93rem}
.soltable{width:100%;border-collapse:collapse;font-size:.9rem}
.soltable td,.soltable th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.soltable th{font:500 .7rem/1.2 var(--mono);text-transform:uppercase;color:var(--muted)}
.soltable tr.culprit td{font-weight:700;color:var(--c-mystery)}

/* me */
.mgrid{display:grid;gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}
.big{font:800 2.6rem/1 var(--display)}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.dots i{aspect-ratio:1;border-radius:4px;background:var(--sunk);display:block;max-width:100%}
.dots i.on{background:var(--c-people)} .dots i.fz{background:var(--c-spot)}
.legend{display:flex;gap:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spark{width:100%;height:44px}
.lawrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem}
.lawrow .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.lawrow .bar i{display:block;height:100%;background:var(--c-people)}
.lawrow .bar i.rc{background:var(--c-recall)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.totals b{display:block;font:700 1.3rem/1 var(--mono)}
.totals span{font-size:.76rem;color:var(--muted)}
a{color:var(--c-spot)}

<script>
/* ---------- Prime Pocket content: every item has exactly one defensible answer ---------- */
const LAWS = {
  4:  {name:"Always say less than necessary", short:"Say less"},
  12: {name:"Selective honesty and generosity", short:"Gift, then ask"},
  14: {name:"Pose as a friend, work as a spy", short:"Friendly spy"},
  19: {name:"Know who you're dealing with", short:"Know the type"},
  40: {name:"Despise the free lunch", short:"No free lunch"}
};
/* Canonical answer labels for "Spot it" cards */
const TACTICS = {
  4:  "Silence made you talk (Law 4)",
  12: "Gift first, then the ask (Law 12)",
  14: "Friendly questions to pull out information (Law 14)",
  40: "Free offer with a hidden price (Law 40)"
};
const TYPES = ["Proud","Insecure","Suspicious","Long memory","Unbothered"];

/* t: scenario | spot | mystery | teaser.  d = difficulty on the 1000 scale.  a = index of the right option. */
const ITEMS = [
/* ---------- Scenarios ---------- */
{id:"sc-4-1", t:"scenario", law:4, d:950, scene:"Family wedding · Rajkot",
 text:"At a cousin's wedding, an uncle asks loudly, in front of six relatives: “So what's your CGPA? And what package will mechanical get you? My son got 32 LPA.” Everyone turns to look at you.",
 q:"Best move?",
 opts:["Give your exact CGPA and explain why mechanical packages are lower","“Doing well, and enjoying it. How's he finding the new job?”","“Your son should lend you some of that package, uncle.”","Walk away without answering"],
 a:1, why:"Short, warm, then the question goes back to him. Exact numbers invite comparison in front of everyone, and the sarcastic line would be repeated at family functions for years: words can't be taken back. Walking away turns it into a scene."},
{id:"sc-4-2", t:"scenario", law:4, d:1100, scene:"Trading club meeting",
 text:"The club president presents a plan for a ₹5,000 live-money trading contest. He turns to you: “Jenil, thoughts?” You see one real risk: nobody has checked the college's rules on money contests.",
 q:"Best move?",
 opts:["Stay quiet. Law 4 says say less.","Give a five-minute critique of every flaw you can think of","“One risk: we should check the college's rules on money contests first. I can look into it this week.”","“Whatever you think is best.”"],
 a:2, why:"Law 4 is a dial, not a vow of silence. When a senior asks you directly, silence or “whatever you think” looks insecure (that's the reversal). One clear point plus an offer to help is short and strong. A long critique buries your best point and puts him on the defensive."},
{id:"sc-4-3", t:"scenario", law:4, d:1000, scene:"Internship interview",
 text:"You finish explaining your project. The interviewer says nothing and just looks at you. Five seconds pass. You feel a strong urge to keep talking.",

 opts:["Keep talking and add every detail you can think of","Stay calm. If the pause goes on, add one line: “Happy to go deeper on any part.”","Ask, “Was that wrong?”","Switch to a safer answer"],
 a:1, why:"Silence pulls people into over-talking and revealing weak spots (Law 4). But total silence with a senior can look unsure, so one calm line hands the turn back without filling the gap with nerves."},
{id:"sc-19-1", t:"scenario", law:19, d:950, scene:"WhatsApp · midnight",
 text:"K, a batchmate who often asks “are you upset with me?”, messages: “saw your story at the café. didn't know you guys were going 🙂”. It was a last-minute plan. You didn't leave him out on purpose.",

{id:"sc-19-2", t:"scenario", law:19, d:1050, scene:"Hackathon · group call",

 q:"Best move?",
 opts:["Point out the bug on the call so it gets fixed fast","After the call, message him: “Found the spot in login that needs one extra check. Want me to push it, or will you?”","Quietly rewrite his login code yourself","Tell the juniors the bug is his"],
 a:1, why:"Proud type: never correct him in public. A private message that frames it as a small addition lets him keep face, and the bug still gets fixed today. Rewriting his code behind his back, or blaming him to juniors, is what he'd remember."},
{id:"sc-19-3", t:"scenario", law:19, d:1100, scene:"Group project",
 text:"Anaya never argues in meetings and always says “it's fine.” Last week she calmly repeated, word for word, a comment you'd made about her slides two months ago. Today you find real errors in her section. It's due in two days.",
 q:"Best move?",
 opts:["Point out the errors in the group chat with screenshots","Message her privately, be specific and kind, and offer to fix it together","Quietly fix her section yourself and say nothing","Make a light joke about it in the next meeting"],
 a:1, why:"Calm in the moment plus exact recall of old words: the long-memory type. A public correction or a joke becomes a stored grudge. A silent fix looks like going behind her back once she notices, and she will. Private, specific and kind fixes the errors without handing her ammunition."},
{id:"sc-12-1", t:"scenario", law:12, d:1000, scene:"Trading club",
 text:"Vikram, a final-year senior you met at the trading club, has bought you lunch three times this week and sent you his notes for two tough courses without being asked. Today over chai he mentions the club's treasurer election next month: “juniors' votes basically decide it.”",
 q:"What's most likely going on?",
 opts:["He's simply a generous senior who likes you","He's building goodwill to collect your vote","He wants you as his trading partner","He's testing whether you can be trusted with money"],
 a:1, why:"Sudden generosity aimed at people who have what he needs (votes), then he raises the election himself: favours first, then the ask. He may like you too; it can be both. Your move: thank him, pay for the next chai, and decide your vote on merit."},
{id:"sc-12-2", t:"scenario", law:12, d:1000, scene:"Hostel · day 3",
 text:"Rahul, new on your floor, tells you on day 3: “Telling only you this: I failed a semester last year.” Ten minutes later he asks how your algo picks its trades and what returns it makes.",
 q:"Best move?",
 opts:["Share your strategy. He trusted you with a secret, so it's only fair.","Keep his secret, stay warm, and keep your strategy general: “Still testing it, honestly. What got you into trading?”","Tell him you don't trust him","Tell someone else his secret to see if he notices"],
 a:1, why:"Disclosure pulls disclosure: his secret makes you feel you owe him one of yours. That pull is the trap. Be kind and keep his secret, but let your openness follow his track record, not his first move."},
{id:"sc-12-3", t:"scenario", law:12, d:1100, scene:"Hostel room",
 text:"Your roommate has bought you food four times this week. He asks to borrow your bike for a weekend trip to Udaipur, and you say no because you need it for your internship commute. He says: “Wow. After all the times I paid for you?”",
 q:"Best reply?",
 opts:["Give him the bike. He has a point.","“I really appreciate the food, and I'll treat you this weekend. The bike's still a no, I need it for work.”","Transfer him the exact food money and stop talking to him","Apologise until he's okay with it"],
 a:1, why:"Linking past favours to this ask shows they were a down payment, not gifts. That's the no-test. Keep the two separate: grateful for the food, still no on the bike. Paying it back coldly or cutting him off turns a small test into a war."},
{id:"sc-14-1", t:"scenario", law:14, d:1050, scene:"Startup meetup · Ahmedabad",
 text:"Raghav, a friendly founder, spends twenty minutes with you. He laughs at your jokes and asks your algo's win rate, which broker API you use, and how you size positions. When you ask what his startup does, he says “fintech, still in stealth” and asks about your backtests.",
 q:"What's most likely going on?",
 opts:["He's shy about an early idea","He's collecting information for something of his own","He's about to offer you a job","He's just curious about trading"],
 a:1, why:"One-way flow: every question pulls out how your system works, and he dodges every question back. That's a probe, whatever his reason. Bounce it (“Still early. What problem are you solving?”) and don't send backtests to someone who won't say what he's building."},
{id:"sc-14-2", t:"scenario", law:14, d:1000, scene:"Hostel · 1 am",
 text:"A guy from another branch you met tonight asks which internships you applied to, what stipend you were offered, and who else from your class got shortlisted. Later he mentions he's applying to the same firm.",
 q:"He asks your stipend. Best reply?",
 opts:["Tell him; he's just making conversation","“Still waiting on the final offer, honestly. Where have you applied?”","“Why do you want to know?”","Say a higher number to look good"],
 a:1, why:"Three questions about your position, from someone competing for the same seat: a probe. The bounce is warm, gives nothing useful, and turns the question around. “Why do you want to know?” is cold and starts a fight; a fake number is a lie that can come back."},
{id:"sc-14-3", t:"scenario", law:14, d:1100, scene:"Family function",
 text:"An uncle who runs a rival consultancy is unusually friendly at a function. Over tea he asks which big clients your father is handling these days and what he charges them.",
 q:"Best reply?",
 opts:["Tell him; he's family","“Papa handles all that, honestly I don't follow it. How's your business going?”","“I can't tell you, that's confidential.”","Guess, so you don't look clueless"],
 a:1, why:"Relaxed setting, friendly tone, questions that help him: Law 14. Pointing to your father is true, polite and gives nothing, and the question back keeps it warm. “That's confidential” is correct but announces that you see him as a threat, which a relative will remember."},
{id:"sc-40-1", t:"scenario", law:40, d:950, scene:"Instagram DM",
 text:"A trading influencer with a Lamborghini in every reel invites you to a FREE 3-day masterclass: “Learn my 90% win-rate strategy.” Day 3 includes a “special offer for attendees only.”",
 q:"What's the real product?",
 opts:["The strategy taught in the three days","Your phone number, plus a big course sold to you on day 3","Charity for students","Networking with other traders"],
 a:1, why:"When it's free, find who's paying. Events like this collect leads and sell the expensive course at the end. Also: anyone selling stock advice in India must be SEBI-registered. Check that before believing a single number."},
{id:"sc-40-2", t:"scenario", law:40, d:1100, scene:"Senior's room",
 text:"A senior is upgrading his laptop and offers you his old one for free. Then he adds: “Just help me with my startup's backend when you get time. Nothing big.”",
 q:"Best move?",
 opts:["Take it. Free laptop.","“That's generous. Let me pay you a fair price for it, and I'm happy to help with the backend when I can.”","Refuse and tell him you see what he's doing","Take it and avoid him later"],
 a:1, why:"“Nothing big” is an open-ended debt with no price on it. Paying a fair amount keeps you free to say no later, and you can still choose to help. Taking it and dodging him is the worst of both."},

/* ---------- Spot it: chats. msgs: [who, text]  who = t (them) | m (me) | d (divider). tell = index of the giveaway ---------- */
{id:"sp-12-1", t:"spot", kind:"move", law:12, d:950, who:"Aarav", sub:"Batchmate",
 msgs:[["d","Monday"],["t","brought you the notes from the class you missed 📒"],["m","thanks bro, lifesaver"],["d","Tuesday"],["t","got you a chai too ☕"],["d","Wednesday"],["t","btw can you add my name to your mini-project? I'll help next time pakka"]],
 tell:6, why:"Two favours you didn't ask for, then an ask much bigger than the favours: gift first, then the ask. Your line: “Thanks for the notes, really. The project's already submitted with our names though.”"},
{id:"sp-12-2", t:"spot", kind:"move", law:12, d:1050, who:"Mama", sub:"Uncle",
 msgs:[["t","Beta, sent you ₹1,100 on UPI for Diwali 🪔"],["m","Thank you mama! 🙏"],["t","You are good with computers na"],["t","Can you do my shop's GST filing this month? The CA is charging too much"]],
 tell:3, why:"A gift, a compliment, then a job a professional charges for. It may be innocent family stuff, but notice the order: gift first, then the ask. Decide on the task itself, not on the ₹1,100."},
{id:"sp-14-1", t:"spot", kind:"move", law:14, d:950, who:"Kunal", sub:"Rival team · hackathon",
 msgs:[["t","yo great demo today 🔥"],["t","what model are you guys using for the backend?"],["t","and the dataset, scraped or API?"],["m","thanks! still tweaking stuff"],["t","haha cool, how many rows did you get?"]],
 tell:4, why:"Praise, then three questions about your build, and he keeps pushing after your vague answer. Bounce it: “Depends on the day, haha. What are you guys building?”"},
{id:"sp-14-2", t:"spot", kind:"move", law:14, d:1050, who:"Neha", sub:"Internship batch",
 msgs:[["t","heyy how was your HR round?"],["t","did they say the stipend?"],["m","went okay! how was yours?"],["t","haha mine is next week. did they ask DSA or projects?"],["t","and who else from your college got shortlisted?"]],
 tell:3, why:"You asked one question back. She dodged it and asked two more. One-way flow is the tell. Match what she shares: if she shares nothing, you share little."},
{id:"sp-40-1", t:"spot", kind:"move", law:40, d:900, who:"Stock Guru Official", sub:"Telegram channel",
 msgs:[["t","FREE for members: tomorrow's jackpot stock 🚀"],["t","Buy XYZ at 9:15 sharp. Target 40%"],["t","VIP group ₹1,999 today only (₹4,999 tomorrow)"]],
 tell:2, why:"Free tips, then a VIP upsell with a fake deadline. The free tip is the second trap: they buy XYZ before telling thousands of members, then sell to all of you at 9:15. You're the product."},
{id:"sp-40-2", t:"spot", kind:"move", law:40, d:1000, who:"Siddharth", sub:"College senior",
 msgs:[["t","Bro free pass for the Ahmedabad startup summit, normally ₹2,000 🎟️"],["t","you just sign up with 5 friends using my code"],["t","and post a story tagging them"]],
 tell:1, why:"The pass is free because you pay with your friends' sign-ups and your followers' attention. Fine if you want to go, but know the price."},
{id:"sp-4-1", t:"spot", kind:"move", law:4, d:1000, who:"Landlord uncle", sub:"PG room rent",
 msgs:[["m","Uncle, can we do ₹6,500 a month for the room?"],["t","Hmm."],["m","I mean, I could do ₹7,000 if needed"],["t","..."],["m","okay ₹7,500 is fine, final"]],
 tell:3, why:"He said almost nothing, and you raised your own offer twice. Silence makes people fill the gap. Counter: say your number, then wait. Whoever speaks next usually gives something up."},
{id:"sp-4-2", t:"spot", kind:"move", law:4, d:1050, who:"Riya", sub:"Team lead",
 msgs:[["m","so that's the plan, I think it can work"],["t","ok"],["m","I mean the auth part is still weak tbh"],["m","and I haven't tested it at scale"],["m","and honestly not sure about the timeline either"]],
 tell:1, why:"One “ok” and you listed three weak spots nobody asked about. Her short reply wasn't a verdict; you treated the silence as one. Next time, after “ok”, ask “Anything you'd change?” and let her talk."},
{id:"sp-19-1", t:"spot", kind:"type", law:19, type:"Long memory", avoid:["Unbothered"], d:1000, who:"Arjun", sub:"Batchmate",
 msgs:[["d","In class · September"],["m","bro your slides looked like a 2010 PowerPoint 😂"],["t","haha it's fine"],["d","Group chat · two months later"],["t","remember when Jenil said my slides looked like a 2010 PowerPoint? 🙂"]],
 tell:4, why:"Calm in the moment, then your exact words two months later: the long-memory type. Never humiliate him, and repair slips early and privately: “Hey, that joke was dumb, your slides were fine.”"},
{id:"sp-19-2", t:"spot", kind:"type", law:19, type:"Insecure", avoid:["Suspicious"], d:950, who:"Karan", sub:"Friend",
 msgs:[["t","you replied to everyone in the group but me"],["t","are you upset with me?"],["t","it's fine if you are, just tell me"]],
 tell:1, why:"He reads rejection into a missed reply and asks for reassurance: insecure. Be clear and kind (“Not upset at all, just missed it. What's up?”), and never tease this type."},
{id:"sp-19-3", t:"spot", kind:"type", law:19, type:"Proud", avoid:["Insecure"], d:1050, who:"Mihir", sub:"Project partner",
 msgs:[["m","pushed a fix for the sorting bug, works now"],["t","It works but I would never write it like that"],["t","I had AIR 2,400, I know how to structure code"],["t","We'll use my approach"]],
 tell:2, why:"Drops his rank, has to win, can't accept your fix: proud. Don't fight him in public. Build on his idea: “Your structure plus my fix for the edge case?” He keeps face and the bug stays fixed."},
{id:"sp-19-4", t:"spot", kind:"type", law:19, type:"Suspicious", avoid:["Insecure"], d:1050, who:"Sahil", sub:"Classmate",
 msgs:[["m","nice presentation today!"],["t","what do you mean by “nice”?"],["t","everyone says things to me with some hidden meaning"],["t","the prof is clearly against me too"]],
 tell:1, why:"Reads a hidden motive into a compliment and thinks people are against him: suspicious. Stay neutral and predictable. Don't join his theories about the prof, and don't argue with them either."},

/* ---------- Mini mysteries ---------- */
{id:"mm-1", t:"mystery", d:1100, title:"The missing pen drive",
 text:"Your team's pen drive, holding the final code, sat on Desk 3 in the CAD lab. Meera says it was there when she sat down at 2:00. At 2:30 it was gone. The lab has one door, and a camera covers it. Between 2:00 and 2:30 the camera shows only Kabir from a rival team coming in (2:10) and going out (2:20). Meera stayed inside the whole time with headphones on.",
 clues:["The lab PC log shows the pen drive was plugged into PC-7 at 2:24 and its files were copied.","PC-7 is the computer at Meera's seat.","Aarav was at the canteen from 1:55 to 2:40.","Rohan says he was in the library; the register shows him signing in at 2:35."],
 q:"Who took the pen drive?", opts:["Aarav","Meera","Kabir","Rohan"], a:1,
 hint:"One door, on camera. Who was inside the lab at 2:24?",
 why:"Only Kabir and Meera were in the lab, and Kabir left at 2:20. At 2:24 the drive was copied on Meera's own PC. Rohan's gap is the red herring: he never came through the only door."},
{id:"mm-2", t:"mystery", d:1050, title:"The wedding envelope",
 text:"At a cousin's wedding, a gift envelope with ₹21,000 vanished from the gift table between 8:00 and 8:15 pm. The table stands a few steps from the stage, where the photographer was taking family group photos.",
 clues:["Photos taken at 8:05, 8:10 and 8:14 all show cousin Nikhil on stage.","Paresh uncle is in the 8:05 and 8:14 photos, but missing from the 8:10 one.","Ten guests saw Mahesh the caterer in the kitchen tent, far from the stage, the whole time.","Sunny the DJ was taking requests by hand, and the music never stopped."],
 q:"Who took the envelope?", opts:["Nikhil","Paresh uncle","Mahesh","Sunny"], a:1,
 hint:"Who is missing from one of the photos?",
 why:"Nikhil is in every photo, Mahesh has ten witnesses, and Sunny couldn't leave the booth without the music stopping. Paresh uncle is the only one who disappears, in the 8:10 photo, and the table is a few steps from the stage."},
{id:"mm-3", t:"mystery", d:1150, title:"The leaked paper",
 text:"At 9:47 pm, a photo of the Thermodynamics mid-sem paper appeared in a WhatsApp group. In the photo, the paper lies on a desk next to a blue coffee mug, and behind it a wall calendar shows OCTOBER. Four people had access to the paper that evening.",
 clues:["Professor Desai never flips her office calendar. It still shows September.","TA Sneha printed the papers at 6 pm. Her desk has a red mug she never lets anyone use.","TA Arjun's desk has a blue mug, and his calendar is up to date.","Ramesh bhai, the peon, uses a basic keypad phone with no camera."],
 q:"Whose desk was the photo taken at?", opts:["Ramesh bhai","Sneha","Arjun","Professor Desai"], a:2,
 hint:"Match the mug colour and the calendar month.",
 why:"The photo needs a blue mug and a calendar on October. Desai's calendar shows September, Sneha's mug is red, and Ramesh bhai's phone has no camera. Only Arjun's desk matches. Sneha printing the papers is the red herring: opportunity isn't proof."},
{id:"mm-4", t:"mystery", d:1200, title:"The midnight Maggi",
 text:"Someone finished the floor's shared Maggi stash at 1 am. Four roommates were awake, and each says one thing. Exactly one of them is lying, and the liar is the one who ate it.",
 clues:["Dev: “Ishaan ate it.”","Ishaan: “Dev is lying.”","Karan: “I didn't eat it.”","Yash: “It wasn't Ishaan.”"],
 q:"Who ate the Maggi?", opts:["Dev","Ishaan","Karan","Yash"], a:0,
 hint:"Dev and Ishaan can't both be telling the truth. Try each as the liar.",
 why:"Dev and Ishaan contradict each other, so one of them is the liar. If Ishaan were lying, Dev's claim would be true, which makes Yash a liar too: two liars. So Dev is the liar, everyone else is truthful, and the liar ate it."},
{id:"mm-5", t:"mystery", d:1100, title:"The leaked screenshot",
 text:"At 11:42 pm someone screenshotted the friends' group chat and posted it on a public story. The screenshot's status bar shows three things: dark mode, a Jio signal, and 23% battery.",
 clues:["Dev uses an iPhone in light mode.","Priya's phone is in dark mode, on Airtel.","Sameer's phone (dark mode, Jio) sat on charge at 100% all night.","At 11:30 Tanvi (dark mode, Jio) said she was on 25% and asked for a charger. Nobody had one."],
 q:"Who took the screenshot?", opts:["Dev","Priya","Sameer","Tanvi"], a:3,
 hint:"Check each person against the three things in the status bar.",
 why:"Dark mode rules out Dev, Jio rules out Priya, and 23% rules out Sameer, who was at 100%. Tanvi was on 25% at 11:30 with no charger, so 23% at 11:42 fits."},

/* ---------- Brain teasers ---------- */
{id:"tz-1", t:"teaser", d:900, text:"A stock rises 10% on Monday and falls 10% on Tuesday. Overall it is…",
 opts:["Back where it started","Down 1%","Up 1%","Down 10%"], a:1, hint:"Start with ₹100.",
 why:"₹100 → ₹110 → ₹99. The 10% fall is taken from a bigger number than the 10% rise was, so it's down 1%."},
{id:"tz-2", t:"teaser", d:950, text:"A portfolio falls 50%. What gain does it need to get back to where it started?",
 opts:["50%","75%","100%","150%"], a:2, hint:"Start with ₹100.",
 why:"₹100 → ₹50. Getting from ₹50 back to ₹100 means doubling: a 100% gain. That's why traders obsess over cutting losses."},
{id:"tz-3", t:"teaser", d:1000, text:"A strategy wins 60% of its trades. Each win makes ₹100; each loss costs ₹200. On average, per trade, it…",
 opts:["Makes ₹20","Loses ₹20","Makes ₹40","Breaks even"], a:1, hint:"Add up chance × payoff for wins and losses.",
 why:"0.6 × ₹100 − 0.4 × ₹200 = ₹60 − ₹80 = −₹20. A high win rate means nothing without the size of the wins and losses."},
{id:"tz-4", t:"teaser", d:950, text:"A bat and a ball cost ₹110 together. The bat costs ₹100 more than the ball. How much is the ball?",
 opts:["₹10","₹5","₹1","₹55"], a:1, hint:"Try ₹10. What would the bat cost?",
 why:"If the ball is x, the bat is x + 100, so 2x + 100 = 110 and x = ₹5. The fast answer, ₹10, makes the bat only ₹90 more."},
{id:"tz-5", t:"teaser", d:1000, text:"A patch of lily pads doubles in size every day. It covers the whole lake on day 48. On which day did it cover half the lake?",
 opts:["Day 24","Day 47","Day 36","Day 46"], a:1, hint:"Go back one day.",
 why:"It doubles every day, so one day before it covered the lake, it covered half: day 47."},
{id:"tz-6", t:"teaser", d:1000, text:"5 machines take 5 minutes to make 5 widgets. How long do 100 machines take to make 100 widgets?",
 opts:["100 min","20 min","5 min","1 min"], a:2, hint:"How long does one machine take to make one widget?",
 why:"Each machine makes one widget in 5 minutes. 100 machines working at once make 100 widgets in the same 5 minutes."},
{id:"tz-7", t:"teaser", d:1050, text:"You flip a fair coin until you get heads. On average, how many flips does it take?",
 opts:["1","1.5","2","3"], a:2, hint:"If something has a 1-in-n chance each try, it takes n tries on average.",
 why:"Each flip has a ½ chance, so on average it takes 1 ÷ ½ = 2 flips."},
{id:"tz-8", t:"teaser", d:1150, text:"Game show: three doors, a car behind one. You pick door 1. The host, who knows where the car is, always opens a door with a goat, here door 3, and offers you door 2 instead. If you switch, your chance of the car is…",
 opts:["1/2","1/3","2/3","No difference"], a:2, hint:"How often was your first pick wrong?",
 why:"Your first pick is right 1/3 of the time. The other 2/3 of the time the car is behind one of the other doors, and the host has just shown you which one. Switching wins 2/3."},
{id:"tz-9", t:"teaser", d:1100, text:"How many people do you need in a room for about a 50% chance that two of them share a birthday?",
 opts:["23","60","183","365"], a:0, hint:"Count pairs of people, not people.",
 why:"23 people make 253 pairs, and each pair has a small chance of matching. Together that's about a 50.7% chance of at least one shared birthday."},
{id:"tz-10", t:"teaser", d:1200, text:"A disease affects 1 in 100 people. A test is 99% accurate for sick and healthy people alike. You test positive. Roughly what's the chance you have it?",
 opts:["99%","90%","50%","1%"], a:2, hint:"Imagine 10,000 people and count the positive tests.",
 why:"Of 10,000 people, 100 are sick and 99 of them test positive. Of the 9,900 healthy, 1% (99) also test positive. So 99 of 198 positives are sick: 50%. One signal is weak evidence when the thing is rare. Same with reading people."},
{id:"tz-11", t:"teaser", d:1100, text:"32 fund managers pick stocks by flipping coins. After 5 years, how many would you expect to have beaten the market every single year?",
 opts:["0","1","5","16"], a:1, hint:"Halve it five times.",
 why:"Each year half get lucky: 32 → 16 → 8 → 4 → 2 → 1. One “genius” with a perfect record, from pure chance. That's survivorship bias, and it's how tip channels are made (Law 40)."},
{id:"tz-12", t:"teaser", d:1150, text:"You roll a die and win that many rupees. You may reroll once, but then you must keep the second roll. Playing smart, what's your average win?",
 opts:["₹3.50","₹4.00","₹4.25","₹4.50"], a:2, hint:"Keep a roll only if it beats the average of a fresh roll (3.5).",
 why:"Reroll on 1, 2 or 3. Half the time you keep 4, 5 or 6 (average 5); half the time you reroll (average 3.5). (5 + 3.5) ÷ 2 = ₹4.25."},
{id:"tz-13", t:"teaser", d:1050, text:"What's the angle between the hour and minute hands at 3:15?",
 opts:["0°","7.5°","15°","22.5°"], a:1, hint:"The hour hand moves too.",
 why:"The minute hand points at 3. The hour hand has moved a quarter of the way from 3 to 4, and a quarter of 30° is 7.5°. So they're 7.5° apart."}
];

          if(r>0){ const s=cl.vs[(r-1)*6+c]; if(s&&(s===1?rows[r-1][c]!==p[c]:rows[r-1][c]===p[c])) ok=false; }
          if(r>=2&&rows[r-1][c]===p[c]&&rows[r-2][c]===p[c]) ok=false;
          let ones=p[c]; for(let q=0;q<r;q++) ones+=rows[q][c]; const zeros=(r+1)-ones; if(ones>3||zeros>3) ok=false;
        }
        if(!ok) continue; rows.push(p); rec(r+1); rows.pop(); if(count>=limit) return;
      }
    })(0);
    return count;
  }
  function sunmoon(opts){
    const diff=opts.diff||"easy", r=rng(opts.seed), level=diff==="easy"?1:2;
    for(let attempt=0;attempt<80;attempt++){
      const rows=[];
      const okSoFar=()=>{ const R=rows.length; for(let c=0;c<6;c++){ let ones=0; for(let q=0;q<R;q++) ones+=rows[q][c]; if(ones>3||R-ones>3) return false; if(R>=3&&rows[R-1][c]===rows[R-2][c]&&rows[R-2][c]===rows[R-3][c]) return false; } return true; };
      if(!(function rec(){ if(rows.length===6) return true; for(const p of shuf(LINES,r)){ rows.push(p); if(okSoFar()&&rec()) return true; rows.pop(); } return false; })()) continue;
      const sol=[].concat(...rows);
      const cl={given:sol.slice(), hs:new Array(30).fill(0), vs:new Array(30).fill(0)};
      for(let rr=0;rr<6;rr++) for(let c=0;c<5;c++) cl.hs[rr*5+c]=sol[rr*6+c]===sol[rr*6+c+1]?1:2;
      for(let rr=0;rr<5;rr++) for(let c=0;c<6;c++) cl.vs[rr*6+c]=sol[rr*6+c]===sol[(rr+1)*6+c]?1:2;
      const pool=shuf([].concat([...Array(36).keys()].map(i=>["g",i]),[...Array(30).keys()].map(i=>["h",i]),[...Array(30).keys()].map(i=>["v",i])),r);
      for(const [kind,i] of pool){
        const arr=kind==="g"?cl.given:kind==="h"?cl.hs:cl.vs; const old=arr[i]; arr[i]=kind==="g"?-1:0;
        if(!binLogic(cl,level).solved) arr[i]=old;
      }
      if(binCount(cl,2)!==1) continue;
      if(diff!=="easy"&&attempt<60&&binLogic(cl,1).solved) continue;
      const givens=cl.given.filter(x=>x>=0).length; if(givens<2) continue;
      return {type:"sunmoon",diff,seed:opts.seed>>>0,given:cl.given,hs:cl.hs,vs:cl.vs,solution:sol};
    }
    return null;
  }

  /* ================= Number Path (one line through every cell, 1 → K in order) ================= */
  function pathCount(R,C,wp,limit,collect){
    const N=R*C, num=new Int16Array(N).fill(0); let K=0; wp.forEach((cell,k)=>{ num[cell]=k+1; K=k+1; });
    const visited=new Uint8Array(N), path=[]; let count=0; const sols=[];
    const nb=i=>{ const r=Math.floor(i/C), c=i%C, a=[]; if(r>0) a.push(i-C); if(r<R-1) a.push(i+C); if(c>0) a.push(i-1); if(c<C-1) a.push(i+1); return a; };
    const NB=[...Array(N).keys()].map(nb);
    function prune(head,depth,nextK){
      // unvisited cells must stay connected to the head, and no cell may become a dead end
      const left=N-depth; if(left===0) return false;
      let start=-1; for(const j of NB[head]) if(!visited[j]){ start=j; break; } if(start<0) return true;
      const seen=new Uint8Array(N); const q=[start]; seen[start]=1; let n=1;
      while(q.length){ const c=q.pop(); for(const j of NB[c]) if(!visited[j]&&!seen[j]){ seen[j]=1; n++; q.push(j); } }
      if(n!==left) return true;
      for(let i=0;i<N;i++){ if(visited[i]) continue; let free=0; for(const j of NB[i]) if(!visited[j]||j===head) free++; if(num[i]===K?free<1:free<2) return true; }
      return false;
    }
    (function rec(head,depth,nextK){
      if(depth===N){ if(num[head]===K){ count++; if(collect) sols.push(path.slice()); } return; }
      if(prune(head,depth,nextK)) return;
      for(const j of NB[head]){ if(visited[j]) continue; if(num[j]&&num[j]!==nextK) continue; if(num[j]===K&&depth+1!==N) continue;
        visited[j]=1; path.push(j); rec(j,depth+1,num[j]?nextK+1:nextK); path.pop(); visited[j]=0; if(count>=limit) return; }
    })((visited[wp[0]]=1,path.push(wp[0]),wp[0]),1,2);
    return collect?{count,sols}:count;
  }
  function numberPath(opts){
    const diff=opts.diff||"easy", R=diff==="easy"?5:6, C=R, N=R*C, r=rng(opts.seed);
    const minWp=diff==="easy"?Math.round(N/3.2):diff==="medium"?Math.round(N/4.5):Math.round(N/6);
    for(let attempt=0;attempt<40;attempt++){
      // random Hamiltonian path: snake, then many backbite moves
      let path=[]; for(let rr=0;rr<R;rr++){ const row=[]; for(let c=0;c<C;c++) row.push(rr*C+c); if(rr%2) row.reverse(); path.push(...row); }
      const adj=(a,b)=>{ const ar=Math.floor(a/C), ac=a%C, br2=Math.floor(b/C), bc2=b%C; return Math.abs(ar-br2)+Math.abs(ac-bc2)===1; };
      for(let m=0;m<N*30;m++){
        if(r()<0.5) path.reverse();
        const end=path[0], nbrs=[]; const er=Math.floor(end/C), ec=end%C; [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{ const nr=er+dr, nc=ec+dc; if(nr>=0&&nr<R&&nc>=0&&nc<C) nbrs.push(nr*C+nc); });
        const x=nbrs[Math.floor(r()*nbrs.length)]; const j=path.indexOf(x); if(j<=1) continue;
        path=path.slice(0,j).reverse().concat(path.slice(j));
      }
      let broken=false; for(let q=0;q+1<N;q++) if(!adj(path[q],path[q+1])) broken=true; if(broken) continue;
      // waypoints: start, end, and evenly spread stops
      const idx=new Set([0,N-1]); const gap=Math.max(2,Math.floor(N/minWp)); for(let q=gap;q<N-1;q+=gap) idx.add(q+Math.floor(r()*Math.min(2,gap-1)));
      const wpOf=()=>[...idx].sort((a,b)=>a-b).map(q=>path[q]);
      let ok=false;
      for(let fix=0;fix<40;fix++){
        const res=pathCount(R,C,wpOf(),2,true);
        if(res.count===1){ ok=true; break; }
        const rival=res.sols.find(s=>s.some((v,q)=>v!==path[q])); if(!rival) break;
        const q=rival.findIndex((v,q2)=>v!==path[q2]); idx.add(Math.min(N-2,Math.max(1,q)));
      }
      if(!ok) continue;
      for(const q of shuf([...idx].filter(q=>q!==0&&q!==N-1),r)){ if(idx.size<=minWp) break; idx.delete(q); if(pathCount(R,C,wpOf(),2)!==1) idx.add(q); }
      return {type:"path",diff,seed:opts.seed>>>0,R,C,waypoints:wpOf(),solution:path.slice()};
    }
    return null;
  }

  /* ================= rule checks for the player's grid (never compare to the stored answer) ================= */
  function checkSudoku(p,g){ if(g.some(v=>!v)) return false; if(!SDKU) SDKU=latinUnits(6,2,3); return SDKU.units.every(u=>new Set(u.map(i=>g[i])).size===6) && p.givens.every((v,i)=>!v||g[i]===v); }
  function checkCalc(p,g){ const N=p.N; if(g.some(v=>!v)) return false; const U=latinUnits(N); if(!U.units.every(u=>new Set(u.map(i=>g[i])).size===N)) return false;
    return p.cages.every(cg=>{ const v=cg.cells.map(i=>g[i]); if(cg.op==="") return v[0]===cg.target; if(cg.op==="+") return v.reduce((s,x)=>s+x,0)===cg.target; if(cg.op==="×") return v.reduce((s,x)=>s*x,1)===cg.target; if(cg.op==="−") return Math.abs(v[0]-v[1])===cg.target; return Math.max(...v)/Math.min(...v)===cg.target; }); }
  function checkCrowns(p,cr){ const N=p.N; if(cr.length!==N) return false; const rows=new Set(), cols=new Set(), regs=new Set(); for(const i of cr){ rows.add(Math.floor(i/N)); cols.add(i%N); regs.add(p.region[i]); } if(rows.size!==N||cols.size!==N||regs.size!==N) return false; for(const a of cr) for(const b of cr) if(a!==b&&Math.abs(Math.floor(a/N)-Math.floor(b/N))<=1&&Math.abs(a%N-b%N)<=1) return false; return true; }
  function checkSunmoon(p,g){ if(g.some(x=>x<0)) return false; for(let k=0;k<6;k++){ const row=[0,1,2,3,4,5].map(q=>g[k*6+q]), col=[0,1,2,3,4,5].map(q=>g[q*6+k]); for(const l of [row,col]){ if(l.filter(x=>x===1).length!==3) return false; for(let q=0;q+2<6;q++) if(l[q]===l[q+1]&&l[q+1]===l[q+2]) return false; } }
    for(let r=0;r<6;r++) for(let c=0;c<5;c++){ const s=p.hs[r*5+c]; if(s&&(s===1)!==(g[r*6+c]===g[r*6+c+1])) return false; }
    for(let r=0;r<5;r++) for(let c=0;c<6;c++){ const s=p.vs[r*6+c]; if(s&&(s===1)!==(g[r*6+c]===g[(r+1)*6+c])) return false; }
    return p.given.every((x,i)=>x<0||g[i]===x); }
  function checkPath(p,path){ const N=p.R*p.C; if(path.length!==N||new Set(path).size!==N) return false; for(let q=0;q+1<N;q++){ const a=path[q], b=path[q+1]; if(Math.abs(Math.floor(a/p.C)-Math.floor(b/p.C))+Math.abs(a%p.C-b%p.C)!==1) return false; }
    let k=0; for(const cell of path){ const w=p.waypoints.indexOf(cell); if(w>=0){ if(w!==k) return false; k++; } } return k===p.waypoints.length&&path[0]===p.waypoints[0]&&path[N-1]===p.waypoints[p.waypoints.length-1]; }

  const TYPES={
    sudoku:{name:"Mini Sudoku",gen:sudoku,rule:"Fill the grid so every row, column and 2×3 box has 1–6 exactly once.",check:checkSudoku},
    crowns:{name:"Crowns",gen:crowns,rule:"Place one crown in every row, every column and every colour. Crowns can’t touch, not even diagonally.",check:checkCrowns},
    sunmoon:{name:"Sun & Moon",gen:sunmoon,rule:"Fill every cell with a sun or a moon. Each row and column has 3 of each, never 3 of the same in a row. = means the two cells match; × means they differ.",check:checkSunmoon},
    path:{name:"Number Path",gen:numberPath,rule:"Draw one line from 1 through every number in order, passing through every cell exactly once.",check:checkPath},
    calc:{name:"Calcudoku",gen:calcudoku,rule:"Each row and column has every number once. Each outlined group must make its target with its operation (+ − × ÷).",check:checkCalc}
  };
  function generate(type,opts){ const t=TYPES[type]; return t?t.gen(opts):null; }
  return {TYPES,generate,hash,rng,
    _test:{sdkCount,latinLogic,latinUnits:()=>SDKU||(SDKU=latinUnits(6,2,3)),crownCount,crownLogic,binCount,binLogic,pathCount,calcCount,calcLogic,cageTuples,LINES}};
})();
if (typeof module !== "undefined") module.exports = PZ;

{id:"g1",t:"Frozen at the big moment",
 scene:"8:40 am, outside the exam hall. Aarav topped every mock this semester. Ten minutes before the end-sem, his hands are cold and his head feels empty. “I can’t remember anything. Maybe I should skip and take the re-exam.”",
 q:"What would help Aarav most in the next ten minutes?",
 o:["Tell him he’ll definitely top, like always","Name what’s happening, then give one tiny step: walk in and read Q1 only","Let him skip; a re-exam is less pressure","Quickly revise the hardest chapter together"],a:1,
 rv:"Panic shrinks your world to the worst outcome. Reassurance (“you’ll top”) argues with the fear and usually loses. Naming it (“this is a freeze”) and shrinking the job to one step gets the body moving, and once he’s moving, memory comes back.",
 pic:{k:"chain",steps:["Big moment arrives","Mind jumps to the worst outcome","Body freezes","Name it + one small step","Moving again"],hi:3},
 term:{w:"Hṛdaya-daurbalya",g:"“weakness of the heart”: the freeze that hits even strong people right before the moment that matters."},
 v:[{ref:"2.3",who:"Krishna",s:"klaibyam ma sma gamah partha naitat tvayyupapadyate / kshudram hridaya daurbalyam tyaktvottishtha parantapa",i:"klaibyaṃ mā sma gamaḥ pārtha naitat tvayyupapadyate / kṣudraṃ hṛdaya daurbalyaṃ tyaktvottiṣṭha parantapa",m:"Don’t give in to this cowardly weakness, Arjuna; it doesn’t suit you. Shake off this small weakness of the heart and stand up.",n:"Klaibya is often translated “unmanliness”. We use “cowardly weakness”, which is what it means here."},
    {ref:"2.7",who:"Arjuna",s:"karpanya doshopahata svabhavah / pricchami tvam dharma sammudha chetah / yac chreyah syannishchitam bruhi tanme / shishyaste 'ham shadhi mam tvam prapannam",i:"kārpaṇya doṣopahata svabhāvaḥ / pṛcchāmi tvāṃ dharma sammūḍha cetāḥ / yac chreyaḥ syānniścitaṃ brūhi tanme / śiṣyaste 'haṃ śādhi māṃ tvāṃ prapannam",m:"My mind is confused about what’s right. Tell me clearly what is better. I am your student; teach me."}],
 st:["The Gita opens on a battlefield. Arjuna is the best archer alive. Seconds before the war he looks across, sees teachers and cousins on the other side, and collapses. His bow slips; he sits down in his chariot and says he won’t fight.","He asks Krishna, “I am your student; teach me.” Krishna’s first reply isn’t comfort. It’s: “This weakness doesn’t suit you. Stand up.” Then come hundreds of verses of reasons. The first step was only: stand up. (The setting is a war in the epic; many read it as an inner battle. Either way, this lesson is about freezing, not fighting.)"],
 rule:"When you freeze, don’t argue with the fear. Name it, then shrink the job to one first step.",
 tr:{s:"Hackathon finals. Your team’s demo crashes two minutes before you present. Your teammate Kavya says, “Let’s just withdraw.”",q:"Best first move?",o:["Withdraw; a broken demo looks worse than no demo","“We’re panicking. One step: open the backup screenshots and present the idea.”","Spend the two minutes trying to fix the bug","Tell her the judges won’t notice"],a:1,w:"Naming the panic and picking one doable step gets you on stage. Fixing a bug in two minutes under panic usually fails, and withdrawing locks in the loss."},
 wy:{q:"Why does “one small step” beat “you’ll be fine”?",o:["A small step restarts action; reassurance just argues with the fear","Fear always disappears if you wait long enough","Because the outcome doesn’t matter at all"],a:0,f:"“You’ll be fine” asks the mind to believe something. “Read Q1” asks the body to do something small, and action is what breaks a freeze."},

{id:"g2",t:"Your job is the effort",

 rv:"Refreshing feels like doing something, but it changes nothing about the result. The result now depends on things outside his hands. The assignment is fully in his hands, and it’s the only thing tonight he can still make better.",
 pic:{k:"split",l:"Effort: yours",ls:"assignment, prep, sleep",r:"Outcome: not fully yours",rs:"results, other candidates, luck",hi:"l"},
 term:{w:"Karma vs karma-phala",g:"the action (karma) vs the fruit of the action (karma-phala)."},
 v:[{ref:"2.47",who:"Krishna",s:"karmany evadhikaras te ma phaleshu kadachana / ma karma phala hetur bhur ma te sango 'stvakarmani",i:"karmaṇy evādhikāras te mā phaleṣu kadācana / mā karma phala hetur bhūr mā te saṅgo 'stvakarmaṇi",m:"Your claim is to the action alone, never to its fruits. Don’t make the fruit your motive, and don’t get attached to doing nothing either."},
    {ref:"18.14",who:"Krishna",s:"adhishthanam tatha karta karanam cha prithag vidham / vividhash cha prithak cheshta daivam chaivatra panchamam",i:"adhiṣṭhānaṃ tathā kartā karaṇaṃ ca pṛthag vidham / vividhāś ca pṛthak ceṣṭā daivaṃ caivātra pañcamam",m:"The body, the doer, the various tools, the various efforts, and chance (daiva) as the fifth."}],
 par:"Students who pictured the process of studying studied more and scored higher than students who pictured getting the good grade (Pham & Taylor, 1999).",
 st:["Arjuna’s worry was all outcomes: “If I fight, who will I lose? What will people say?” Krishna splits the problem in two. Your part is the action. The fruit isn’t yours to command.","Much later, in 18.14, he explains why: every action depends on five things, with daiva (chance) as the fifth. You control some inputs, never all. And the end of 2.47 matters: “don’t be attached to inaction.” This isn’t permission to stop caring. It tells you what to care about."],
 rule:"Put your full care into the effort. Hold the result loosely, because it has inputs you don’t control.",
 tr:{s:"Your trading algo had a losing week even though it followed every rule. A friend in the trading club says, “Your system is broken. Change it.”",q:"What does 2.47 suggest?",o:["Rewrite the strategy tonight","Judge the system by whether you followed it over many trades, not one week’s result","Stop trading forever","Copy your friend’s strategy, since he made money this week"],a:1,w:"One week has a big luck input (daiva). Judge the process across many trades. Changing a sound system after one bad week is reacting to the fruit."},
 wy:{q:"Why doesn’t 2.47 mean “don’t care about results”?",o:["The same verse warns against attachment to inaction: act fully, just don’t let the result be your boss","Because results are all that matter in the end","Because Krishna promises good results to hard workers"],a:0,f:"The verse closes both exits: obsessing over the fruit, and giving up on the action."},
 pl:{i:["I catch myself refreshing results or prices","I start worrying about an outcome I can’t change tonight","I check marks before finishing the work"],t:["close the tab and do 10 minutes of the task I control","write down the one action that’s mine and do it","ask “what’s my part here?” and do only that"]},
 cards:[["Gita 2.47 · Your claim is to the ___ alone, never to its ___.","Action; fruits. And don’t get attached to inaction either: care fully about the effort, hold the result loosely."],["Gita 18.14 · Why are outcomes never fully yours?","Every action has five inputs: body, doer, tools, effort, and daiva (chance). You control some, never all."]],

{id:"g3",t:"Steady in win and loss",

 term:{w:"Āgamāpāyin",g:"“coming and going”: the nature of every pleasure and pain."},
 v:[{ref:"2.14",who:"Krishna",s:"matra sparshas tu kaunteya shitoshna sukha duhkha dah / agamapayino 'nityas tams titikshasva bharata",i:"mātrā sparśās tu kaunteya śītoṣṇa sukha duḥkha dāḥ / āgamāpāyino 'nityās tāṃs titikṣasva bhārata",m:"The touch of the senses brings cold and heat, pleasure and pain. They come and go; they don’t last. Bear them patiently."},
    {ref:"2.15",who:"Krishna",s:"yam hi na vyathayantyete purusham purusharshabha / sama duhkha sukham dhiram so 'mritatvaya kalpate",i:"yaṃ hi na vyathayantyete puruṣaṃ puruṣarṣabha / sama duḥkha sukhaṃ dhīraṃ so 'mṛtatvāya kalpate",m:"The steady person whom these don’t shake, the same in pain and pleasure, is fit for the highest."}],
 st:["Krishna picks the plainest example there is: cold and heat. In January winter feels endless; by April you’ve forgotten it.","Then 2.15: the steady person is the one these don’t shake. Titiksha (patient endurance) isn’t gritting your teeth forever. It’s knowing the weather will change, and not making permanent decisions in a storm."],
 rule:"Don’t make permanent decisions in temporary weather.",
 tr:{s:"A month into second year a friend says, “I’m dropping out of mechanical. I hate it.” He said the same about JEE prep and later loved his rank.",q:"What would 2.14 suggest?",o:["Drop out tomorrow while he’s sure","Note the feeling, wait a few weeks, then decide with a calm head","Never think about changing branch","Ignore the feeling completely"],a:1,w:"The feeling may carry real information, but a decision this big should be made when the weather is calm, not at the peak of a storm."},
 wy:{q:"Why is “it’ll always be like this” usually wrong?",o:["Strong feelings stamp “forever” on things that are actually temporary","Because life is always good","Because bad weeks don’t happen to good students"],a:0,f:"The feeling is real. The forecast is the unreliable part."},
 pl:{i:["I think “it’ll always be like this”","I want to make a big decision while upset","a bad day hits"],t:["say “this is weather” and wait one sleep before deciding","write the decision down and revisit it in 3 days","name one thing that was bad last month and is fine now"]},
 cards:[["Gita 2.14 · Krishna’s examples of things that come and go?","Cold and heat, pleasure and pain. They come and go; bear them patiently (titiksha)."],["Rule from Gita 2.14 for big decisions?","Don’t make permanent decisions in temporary weather. Wait one sleep."]],
 sl:"Tonight’s mood is weather. You’ll wake up under a different sky."},

{id:"g5",t:"The scroll-to-rage slope",
 scene:"10:45 pm. You open Instagram “for 2 minutes”. A reel about a rival college’s fest. You read the comments; someone insults your college. You type a long reply. Now it’s 1:15 am, you’re furious, and you forgot tomorrow’s quiz.",
 q:"Where was the easiest place to stop this?",
 o:["At the angry reply","Right at the start, when you began dwelling on the reel and comments","After you’d won the argument","In the morning, by apologising"],a:1,
 rv:"The chain is easiest to break at the first link. By the time you’re angry, your judgement is already going offline. Two minutes of dwelling is the cheap exit; the angry reply is the expensive one.",
 pic:{k:"chain",steps:["Dwelling on it","Attachment","Craving","Anger","Confusion","Memory slips","Judgement lost"],hi:0},
 term:{w:"Dhyāyato viṣayān",g:"“dwelling on the objects of the senses”: the first link of the chain."},
 v:[{ref:"2.62",who:"Krishna",s:"dhyayato vishayan pumsah sangas teshupajayate / sangat sanjayate kamah kamat krodho 'bhijayate",i:"dhyāyato viṣayān puṃsaḥ saṅgas teṣūpajāyate / saṅgāt sañjāyate kāmaḥ kāmāt krodho 'bhijāyate",m:"When you dwell on things of the senses, attachment grows. From attachment comes craving; from craving, anger."},
    {ref:"2.63",who:"Krishna",s:"krodhad bhavati sammohah sammohat smriti vibhramah / smriti bhramshad buddhi nasho buddhi nashat pranashyati",i:"krodhād bhavati sammohaḥ sammohāt smṛti vibhramaḥ / smṛti bhraṃśād buddhi nāśo buddhi nāśāt praṇaśyati",m:"From anger comes confusion; from confusion, memory slips; when memory goes, judgement is destroyed; when judgement goes, you are lost."}],
 par:"In experiments, people who kept ruminating on an insult got angrier than people who were distracted (Bushman, 2002).",
 st:["Engineers will spot this: a positive-feedback loop. Each stage amplifies the next until the system runs away. Krishna lists seven stages in two verses.","Notice where “memory slips” sits: just before “judgement lost”. That’s the moment you forget the quiz, forget who you’re talking to, forget what you wanted from the evening. The next verse, 2.64, gives the exit: move among things without being yanked by attraction and aversion, and you reach prasāda, a calm, clear mind."],
 rule:"Break the chain at the first link: notice when you start dwelling, and leave before it heats up.",
 tr:{s:"Your cousin posts a political forward in the family WhatsApp group. You notice your chest tightening as you read it a second time.",q:"Which link are you at, and what’s the cheap exit?",o:["Anger: type a reply now","Dwelling: mute the group for an hour and do something else","Judgement lost: leave the group forever","None: it’s fine to read it ten times"],a:1,w:"Reading it again is dwelling, the first link. Muting for an hour costs nothing; a 1 am family argument costs a lot."},
 wy:{q:"Why is the first link the best place to stop?",o:["Each stage amplifies the next, and by the anger stage judgement is already slipping","Because the first link is the most fun","Because anger is never useful"],a:0,f:"Stopping early is cheap. Stopping late needs judgement you no longer have."},
 pl:{i:["I read a comment thread twice","I feel my chest tighten while scrolling","I start typing a long angry reply"],t:["close the app and stand up","put the phone face down for 10 minutes","write the reply in Notes, not the app, and decide tomorrow"]},
 cards:[["Gita 2.62–63 · The seven links from dwelling to ruin?","Dwelling → attachment → craving → anger → confusion → memory slips → judgement lost."],["Where’s the cheapest place to break the scroll-to-rage chain?","The first link: notice when you start dwelling, and leave before it heats up."]],
 sl:"Whatever you didn’t reply to tonight is a fight you won by not fighting."},

{id:"g6",t:"Be a tortoise with your phone",
 scene:"9 pm, thermodynamics. In 25 minutes: 14 notifications. Each check is “5 seconds”. At 9:25 you’ve read one page, and you can’t remember it.",
 q:"What helps focus most?",
 o:["Check the notifications faster","Use more willpower to ignore the buzzes","Pull your senses in before you start: phone in another room, notifications off for the block","Study only when you feel motivated"],a:2,
 rv:"Willpower against a buzzing phone is a losing fight: every buzz restarts the struggle. A tortoise doesn’t fight danger; it pulls its limbs in. Remove the input and there’s nothing to resist.",
 pic:{k:"ring",center:"Your focus",outer:["Notifications","Reels","Chats","Open tabs"],shell:"Senses pulled in"},
 term:{w:"Indriya and indriyārtha",g:"the senses and the things that pull them. Here: your eyes, and the notification."},
 v:[{ref:"2.58",who:"Krishna",s:"yada samharate chayam kurmo 'nganiva sarvashah / indriyanindriyarthebhyas tasya prajna pratishthita",i:"yadā saṃharate cāyaṃ kūrmo 'ṅgānīva sarvaśaḥ / indriyāṇīndriyārthebhyas tasya prajñā pratiṣṭhitā",m:"When, like a tortoise drawing in its limbs, you pull your senses back from the things that pull them, your wisdom becomes steady."},
    {ref:"2.67",who:"Krishna",s:"indriyanam hi charatam yan mano 'nuvidhiyate / tadasya harati prajnam vayur navam ivambhasi",i:"indriyāṇāṃ hi caratāṃ yan mano 'nuvidhīyate / tadasya harati prajñāṃ vāyur nāvam ivāmbhasi",m:"When the mind follows the roaming senses, it carries away your judgement, as the wind carries a boat on the water."}],
 st:["Krishna doesn’t pretend this is easy. In 2.60 he admits the senses “forcibly carry away the mind” even of a wise person who is trying.","And in 2.67: the mind that follows the senses loses its judgement “as the wind carries a boat on the water.” So the tortoise strategy isn’t about being stronger than the wind. It’s pulling the sail in before the wind comes."],
 rule:"Don’t out-muscle distractions. Pull your senses in before you start.",
 tr:{s:"You want to finish a CAD model tonight, but the laptop has 12 tabs open, including YouTube and the trading terminal.",q:"Tortoise move?",o:["Leave the tabs; you’ll ignore them","Close everything except CAD for 45 minutes","Watch one video first to relax","Keep the terminal open in case the market moves"],a:1,w:"Open tabs are limbs sticking out. Closing them before you start removes the fight instead of winning it."},
 wy:{q:"Why does removing the phone beat resisting it?",o:["Each buzz restarts the fight, and the senses “forcibly carry away the mind” (2.60)","Because phones are evil","Because willpower is unlimited"],a:0,f:"Even the Gita says the wise lose that fight. So don’t fight it; avoid it."},
 pl:{i:["I sit down to study","I start a focus block","I get into bed"],t:["put the phone in another room first","turn on Do Not Disturb for 45 minutes","close every tab except the one I need"]},
 cards:[["Gita 2.58 · What animal is the image for controlling the senses?","A tortoise drawing in its limbs. Pull the senses in before the pull starts."],["Gita 2.67 · What does following the senses do to judgement?","Carries it away, as the wind carries a boat on the water."]],
 sl:"Tonight the tortoise move is simple: phone out of reach, limbs in."},

{id:"g7",t:"Portrait of a steady mind",
 scene:"Arjuna asks what every student asks about a role model: “What does a steady person actually look like? How do they speak, sit, walk?” Think of the calmest senior you know during placement week.",
 q:"Which is the real sign of a steady mind?",
 o:["Never feels anything","Not shaken by trouble, not craving in good times, not run by fear or anger","Always wins","Avoids every hard situation"],a:1,
 rv:"Krishna’s portrait isn’t a robot. It’s someone whose mind is “not shaken in sorrows” and who has “no craving amid pleasures”. The test runs both ways: bad news doesn’t sink them, good news doesn’t inflate them.",
 pic:{k:"three",top:"A steady mind (sthita-dhī)",items:["Not shaken by trouble","No craving in good times","Fear and anger don’t drive"]},
 term:{w:"Sthita-prajña",g:"“one of steady wisdom”: the Gita’s role model."},
 v:[{ref:"2.56",who:"Krishna",s:"duhkheshv anudvigna manah sukheshu vigata sprihah / vita raga bhaya krodhah sthita dhir munir uchyate",i:"duḥkheṣv anudvigna manāḥ sukheṣu vigata spṛhaḥ / vīta rāga bhaya krodhaḥ sthita dhīr munir ucyate",m:"One whose mind isn’t shaken by sorrows, who doesn’t crave in pleasures, from whom attachment, fear and anger have gone: that person is called steady of mind."},
    {ref:"2.70",who:"Krishna",s:"apuryamanam achala pratishtham / samudram apah pravishanti yadvat / tadvat kama yam pravishanti sarve / sa shantim apnoti na kama kami",i:"āpūryamāṇam acala pratiṣṭhaṃ / samudram āpaḥ praviśanti yadvat / tadvat kāmā yaṃ praviśanti sarve / sa śāntim āpnoti na kāma kāmī",m:"As rivers pour into the ocean, which keeps filling yet stays in its bed, so the one into whom desires flow finds peace, not the one who chases them."}],
 st:["In 2.70 Krishna paints it: the ocean. Rivers pour in all the time, yet it stays in its bed. Desires keep flowing into everyone. The steady person isn’t empty of them; they just don’t flood.","Then 2.71: whoever drops the constant “I want, mine, me” finds peace. Not by owning less, but by gripping less."],
 rule:"Shaken by neither good news nor bad: desires can flow in without flooding you.",
 tr:{s:"One senior just got a ₹40 LPA offer; another was rejected by the same company. A week later, who is acting more like a sthita-prajña?",q:"Pick the steady behaviour:",o:["The one bragging in every group","The one mocking the rejected guy","Either one, if they keep working and treat people the same as before","The one who stopped coming to class"],a:2,w:"Steadiness isn’t about which result you got. It’s whether the result changed how you behave."},
 wy:{q:"Why is the ocean a good image for a steady mind?",o:["Rivers keep flowing in but it stays in its bed: desires come without flooding you","Because oceans are big and powerful","Because the ocean never changes"],a:0,f:"The steady person still feels the pull. It just doesn’t move them out of their bed."},
 pl:{i:["I hear big news, good or bad","I’m about to brag or sulk","someone else’s result triggers me"],t:["ask “how would a steady senior react?” and do that","wait 10 minutes before posting or replying","keep my next hour exactly as planned"]},
 cards:[["Gita 2.56 · Three things that have “gone” from a steady mind?","Attachment, fear and anger (raga, bhaya, krodha). Not shaken by sorrow, no craving in pleasure."],["Gita 2.70 · The image for a steady mind?","The ocean: rivers keep pouring in, yet it stays in its bed."]],
 sl:"Be the ocean tonight: thoughts can pour in; you don’t have to rise with them."},

{id:"g8",t:"Be your own best friend",
 scene:"You fail a quiz you studied for. The voice in your head starts: “You’re so dumb. Your JEE rank was luck.” Your friend failed the same quiz, and you told him, “One quiz, bro. Let’s see what went wrong.”",
 q:"Which voice will actually help you do better next time?",
 o:["The harsh one; fear keeps you sharp","The one you used for your friend: honest about the mistake, kind to the person","No voice; just forget it happened","Blame the professor"],a:1,
 rv:"You’d never talk to a friend the way you talk to yourself. Harsh self-talk feels like discipline but mostly makes you avoid the subject. The friend-voice keeps you looking at the mistake without running from it.",
 pic:{k:"split",l:"Self as friend",ls:"“What went wrong? Let’s fix it.”",r:"Self as enemy",rs:"“You’re useless.”",hi:"l"},
 term:{w:"Bandhu and ripu",g:"friend and enemy. The verse says your own self can be either."},
 v:[{ref:"6.5",who:"Krishna",s:"uddhared atmanatmanam natmanam avasadayet / atmaiva hyatmano bandhur atmaiva ripur atmanah",i:"uddhared ātmanātmānaṃ nātmānam avasādayet / ātmaiva hyātmano bandhur ātmaiva ripur ātmanaḥ",m:"Lift yourself up by yourself; don’t let yourself sink. You alone are your own friend, and you alone are your own enemy."},
    {ref:"6.6",who:"Krishna",s:"bandhur atmatmanas tasya yenatmaivatmana jitah / anatmanas tu shatrutve vartetatmaiva shatru vat",i:"bandhur ātmātmanas tasya yenātmaivātmanā jitaḥ / anātmanas tu śatrutve vartetātmaiva śatru vat",m:"The self is a friend to whoever has mastered it; to whoever hasn’t, it acts like an enemy."}],
 par:"This lines up with self-efficacy: believing you can act on your situation predicts effort and persistence. It’s also where Psycho-Cybernetics picks up later.",
 st:["This comes in chapter 6, which is about training the mind. Krishna doesn’t say others will lift you. He says lifting is your job, and the same self that drags you down is the one that can pull you up.","6.6 adds a condition: the self is a friend to someone who has some mastery over it, and acts like an enemy to someone who hasn’t. So this is a skill you build, not a mood you wait for."],
 rule:"Talk to yourself the way you’d talk to a friend who failed: honest about the mistake, kind to the person.",
 tr:{s:"You overslept and missed the 8 am lab. Your first thought: “I’m the laziest person alive. Why even try.”",q:"Friend-voice rewrite?",o:["“Yeah, you’re hopeless.”","“You slept at 2. Alarm across the room, bed by 12 tonight.”","“Labs don’t matter anyway.”","“Never mind, skip the next one too.”"],a:1,w:"The friend-voice names a cause and one fix. The enemy-voice only hands down a verdict."},
 wy:{q:"Why does harsh self-talk often backfire?",o:["It makes you avoid the subject instead of fixing it","It makes you too confident","It’s actually the most effective approach"],a:0,f:"If looking at a mistake hurts, you stop looking. The friend-voice keeps you looking."},
 pl:{i:["I call myself dumb or useless","I mess something up","I compare myself to someone and sink"],t:["ask “what would I say to a friend here?” and say that","write one cause and one fix","say “lift, don’t sink” and do one small thing"]},
 cards:[["Gita 6.5 · You alone are your own ___ and your own ___.","Friend and enemy. Lift yourself; don’t let yourself sink."],["Friend-voice formula after a mistake?","Honest about the mistake, kind to the person: one cause, one fix."]],
 sl:"Before you sleep, say one thing to yourself that you’d say to a friend."},

{id:"g9",t:"The mind is like wind",
 scene:"You try to read one chapter. Two minutes in, you’re thinking about the trading club, then the fest, then a reel. You drag yourself back. Two minutes later: gone again. “My focus is broken. This mind-training stuff isn’t for me.”",
 q:"What does your mind wandering actually mean?",
 o:["Reels have damaged your brain beyond repair","Nothing unusual: minds wander, and each time you bring it back is one rep of training","You should study only when your mind is perfectly still","You need stronger coffee"],a:1,
 rv:"Wandering isn’t failure; it’s the default. The training isn’t “never wander”. It’s noticing and returning. Each return is one rep, like a curl for attention.",
 pic:{k:"cycle",nodes:["Focus","Wander","Notice","Return"],hi:3},
 term:{w:"Abhyāsa + vairāgya",g:"practice + letting go: the two-part method for training the mind."},
