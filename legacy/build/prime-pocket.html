 v:[{ref:"6.34",who:"Arjuna",s:"chanchalam hi manah krishna pramathi balavad dridham / tasyaham nigraham manye vayor iva su dushkaram",i:"cañcalaṃ hi manaḥ kṛṣṇa pramāthi balavad dṛḍham / tasyāhaṃ nigrahaṃ manye vāyor iva su duṣkaram",m:"The mind is restless, Krishna: turbulent, strong, stubborn. Holding it seems as hard as holding the wind."},
    {ref:"6.35",who:"Krishna",s:"asamshayam maha baho mano durnigraham chalam / abhyasena tu kaunteya vairagyena cha grihyate",i:"asaṃśayaṃ mahā bāho mano durnigrahaṃ calam / abhyāsena tu kaunteya vairāgyeṇa ca gṛhyate",m:"No doubt, the mind is restless and hard to hold. But with practice and letting go, it can be held."}],
 par:"New habits took about 66 days on average to become automatic, with a wide range, and missing one day didn’t ruin the process (Lally et al.). Practice really is the method.",
 st:["This is the Gita’s most relatable moment. Arjuna, a warrior, says the mind is as hard to hold as the wind. Krishna doesn’t argue. His first words are: “No doubt.” A teacher who agrees the problem is hard is one whose method you can trust.","Then the method, from 6.26: wherever the restless mind wanders off, bring it back from there. Not once; every time. And 6.19 gives the goal image: a lamp in a windless place, its flame not flickering."],
 rule:"Wandering is normal. Training is noticing and returning, again and again.",
 tr:{s:"You do a 25-minute study block and catch your mind wandering 12 times.",q:"How should you score that session?",o:["Failure: 12 distractions","12 reps: you noticed and came back 12 times","Give up focused study","Only count it if there were zero wanders"],a:1,w:"Each catch is the training. A session with 12 returns trained your attention 12 times."},
 wy:{q:"Why does it matter that Krishna agrees (“no doubt”)?",o:["The method doesn’t depend on pretending focus is easy","It means the mind can’t be trained","It means Arjuna was lazy"],a:0,f:"A method that starts by admitting the problem is hard is one you can trust."},
 pl:{i:["I notice my mind wandered while studying","I start a study block","I feel “my focus is broken”"],t:["say “back” and make a tally mark","count my returns, not my wanders","do one 10-minute block and count the reps"]},
 cards:[["Gita 6.35 · What two things hold the restless mind?","Abhyasa (practice) and vairagya (letting go). Krishna first agrees: “No doubt, it’s hard.”"],["Gita 6.26 · What do you do when the mind wanders?","Bring it back from wherever it went. Each return is one rep."]],
 sl:"If your mind wanders in bed tonight, notice and come back to the breath. One rep."},

{id:"g10",t:"Eat, sleep, play: just enough",
 scene:"Your week: Monday, sleep at 3 am. Tuesday, crash for 11 hours and miss class. Wednesday, skip dinner. Thursday, two plates of biryani at midnight. Friday, study 9 hours straight, then nothing for two days.",
 q:"What’s the real problem with this week?",
 o:["Not enough sleep","Too much food","Swinging between too much and too little in everything","Too much studying"],a:2,
 rv:"Every single day has an extreme. The fix isn’t simply more or less; it’s “just enough”, done regularly. Steady inputs give steady output.",
 pic:{k:"meter",zones:["Too little","Just enough","Too much"],hi:1,label:"Food · sleep · effort · fun"},
 term:{w:"Yukta",g:"“fitting, balanced”: moderate in food, play, effort and sleep."},
 v:[{ref:"6.17",who:"Krishna",s:"yuktahara viharasya yukta cheshtasya karmasu / yukta svapnavabodhasya yogo bhavati duhkha ha",i:"yuktāhāra vihārasya yukta ceṣṭasya karmasu / yukta svapnāvabodhasya yogo bhavati duḥkha hā",m:"For one who is balanced in eating and recreation, balanced in effort at work, balanced in sleeping and waking, yoga destroys sorrow."},
    {ref:"6.16",who:"Krishna",s:"natyashnatastu yogo 'sti na chaikantam anashnatah / na chati svapna shilasya jagrato naiva charjuna",i:"nātyaśnatastu yogo 'sti na caikāntam anaśnataḥ / na cāti svapna śīlasya jāgrato naiva cārjuna",m:"Yoga isn’t for one who eats too much or not at all, nor for one who sleeps too much or stays awake too much."}],
 par:"Adults are advised to get 7 or more hours of sleep a night (American Academy of Sleep Medicine), and regular timing matters too. The Charaka course covers this.",
 st:["The verse right before, 6.16, is surprisingly practical: yoga isn’t for someone who eats too much or not at all, sleeps too much or stays up too much.","So a 2,000-year-old spiritual text says the path starts with a sleep schedule. The Charaka course says the same thing in medical terms. Two very different old books agree on something modern sleep science also backs."],
 rule:"Aim for “just enough” in food, sleep, work and fun, at roughly the same times each day.",
 tr:{s:"Exams in 10 days. Your plan: all-nighters for the last three.",q:"The yukta plan?",o:["All-nighters now, sleep after exams","Similar study hours every day for 10 days, 7 hours’ sleep each night","Sleep 12 hours a night to rest the brain","Study only the night before each paper"],a:1,w:"Ten balanced days beat three extreme ones. Sleep is also when memory gets stored."},
 wy:{q:"Why does “just enough” beat extremes?",o:["Extremes cause crashes that undo the gains; steady inputs give steady output","Because extremes are always fun","Because sleep doesn’t affect studying"],a:0,f:"Swinging between extremes keeps you recovering instead of building."},
 pl:{i:["it’s past midnight and I’m still up","I’m about to skip a meal or binge","I plan an all-nighter"],t:["start winding down: phone on charge across the room","eat a normal plate at a normal time","split the work across more days instead"]},
 cards:[["Gita 6.17 · Four things to keep yukta (balanced)?","Food, recreation, effort at work, sleep and waking."],["Gita 6.16 · Yoga isn’t for someone who…","eats too much or not at all, sleeps too much or stays up too much."]],
 sl:"“Just enough” for tonight means: this is a good time to stop."},

{id:"g11",t:"Doing beats avoiding",
 scene:"Machine design assignment due Friday. It’s Wednesday. You’ve “planned” it four times: a to-do list, colour-coded, plus a productivity video. Pages done: zero.",
 q:"What’s actually going on?",
 o:["Good planning; the work will go faster later","Planning has become a way of avoiding the work","You need a better productivity app","You work best under pressure, so it’s fine"],a:1,
 rv:"Planning feels like progress because it’s work-shaped. But it’s safe: it can’t be wrong. The task is where you might struggle, so the brain keeps “preparing”. The way out is starting badly.",
 pic:{k:"split",l:"Doing (even badly)",ls:"progress, feedback",r:"Avoiding (even “planning”)",rs:"feels safe, zero progress",hi:"l"},
 term:{w:"Karma jyāyo hy akarmaṇaḥ",g:"“action is better than inaction.”"},
 v:[{ref:"3.8",who:"Krishna",s:"niyatam kuru karma tvam karma jyayo hyakarmanah / sharira yatrapi cha te na prasiddhyed akarmanah",i:"niyataṃ kuru karma tvaṃ karma jyāyo hyakarmaṇaḥ / śarīra yātrāpi ca te na prasiddhyed akarmaṇaḥ",m:"Do the work that’s yours to do; action is better than inaction. Without action you couldn’t even keep your body going."},
    {ref:"3.6",who:"Krishna",s:"karmendriyani samyamya ya aste manasa smaran / indriyarthan vimudhatma mithyacharah sa uchyate",i:"karmendriyāṇi saṃyamya ya āste manasā smaran / indriyārthān vimūḍhātmā mithyācāraḥ sa ucyate",m:"Whoever holds the body still but keeps the mind on the objects it wants is fooling himself: that’s called false conduct."}],
 st:["In 3.5 Krishna points out that you can’t actually do nothing: no one stays even a moment without acting. The only choice is which action.","3.6 calls out a trick: sitting still outside while the mind keeps chasing the thing. Fake work is the student version: looking busy while the real task waits. 3.19 closes it: do the work that needs doing, without clinging to the outcome."],
 rule:"Start badly rather than plan perfectly. An ugly first page beats a perfect plan.",
 tr:{s:"You want to start going to the gym. You’ve spent two weeks comparing workout plans and protein brands.",q:"The 3.8 move?",o:["Research one more week to find the best plan","Go today and do 20 minutes of anything","Wait for the new semester","Buy better shoes first"],a:1,w:"The research has become the avoidance. Twenty imperfect minutes today beat a perfect plan next month."},
 wy:{q:"Why does planning sometimes turn into avoidance?",o:["It feels productive but can’t fail, so it protects you from the hard part","Because planning is useless","Because good students never plan"],a:0,f:"Planning is useful right up until it becomes a hiding place."},
 pl:{i:["I catch myself re-planning a task","I open my to-do list for the third time","a task feels too big to start"],t:["write the ugliest possible first paragraph","do 10 minutes of the real task before any planning","start with the part I understand best"]},
 cards:[["Gita 3.8 · Action is better than ___.","Inaction. Do the work that’s yours; even keeping the body alive needs action."],["Gita 3.6 · What is “false conduct” (mithyacara)?","Holding still outside while the mind chases the thing. Student version: fake work that dodges the real task."]],
 sl:"Tomorrow’s first step can be ugly. It just has to happen."},

{id:"g12",t:"People copy what you do",
 scene:"You’re the new coordinator of the trading club. You tell members, “Always paper-trade a strategy for a month before real money.” Last week two of them watched you jump into an options trade on a tip.",
 q:"What will the members actually do?",
 o:["Follow your rule, because you said it clearly","Copy what they saw you do","Ignore both","Ask for a written policy"],a:1,
 rv:"People learn rules from behaviour, not speeches. When your words and actions differ, they copy the action every time.",
 pic:{k:"chain",steps:["What you do","What they see","What they copy","The club’s culture"],hi:0},
 term:{w:"Pramāṇa",g:"“standard, measure”: the standard you set by acting."},
 v:[{ref:"3.21",who:"Krishna",s:"yad yad acharati shreshthas tat tad evetaro janah / sa yat pramanam kurute lokas tad anuvartate",i:"yad yad ācarati śreṣṭhas tat tad evetaro janaḥ / sa yat pramāṇaṃ kurute lokas tad anuvartate",m:"Whatever a leading person does, others do too. Whatever standard they set by their actions, the world follows."}],
 st:["Krishna applies this to himself in the next verses (3.22–24): there’s nothing he needs to do, yet he keeps acting, because if he stopped, people would copy that too.","You don’t need a title for this to apply. Your cousin in Rajkot, your juniors, your project team: someone is watching how you handle a deadline, a loss, a phone at dinner."],
 rule:"You set the standard by what you do, not by what you say.",
 tr:{s:"You want your project team to stop missing meetings. You’ve been 10 minutes late to the last three.",q:"Most effective move?",o:["Send a strict message about punctuality","Be 5 minutes early to the next three meetings, then mention it","Start fining people","Cancel meetings"],a:1,w:"Your arrival time is the real standard. Fix it first, and the message has weight."},
 wy:{q:"Why does behaviour beat instructions?",o:["People watch what leaders actually do and treat that as the real rule","Because people don’t read messages","Because rules are always bad"],a:0,f:"Your actions are the rulebook people actually read."},
 pl:{i:["I ask others to do something","I’m leading a team task","I’m around juniors or younger cousins"],t:["check that I’m doing it myself first","do the behaviour visibly before asking","act the way I’d want them to copy"]},
 cards:[["Gita 3.21 · Whatever a leading person does…","…others do too. The standard you set by action is the one people follow."],["How do you fix a team habit you’re guilty of yourself?","Fix your own behaviour first, visibly; then ask."]],
 sl:"Someone copied something you did today. Was it worth copying?"},

{id:"g13",t:"Your own path, even imperfect",
 scene:"Half your batch is grinding DSA for coding interviews because “that’s where the money is”. You actually enjoy CAD, machines and building things; your hackathon builds are hardware. You’re thinking of dropping it all to copy the CS route.",
 q:"What does the Gita suggest?",
 o:["Copy whatever pays most right now","Build on your own strengths and interests, even if you’re imperfect at them","Do both at 100% and sleep 4 hours","Wait until you feel completely sure"],a:1,
 rv:"Doing someone else’s path well still means competing where they’re stronger and you’re less driven. Your own path, done imperfectly, compounds, because you keep going when it gets hard.",
 pic:{k:"split",l:"Your path, imperfect",ls:"your strengths, your drive",r:"Their path, done well",rs:"their strengths, borrowed drive",hi:"l"},
 term:{w:"Svadharma",g:"your own path: your responsibilities and strengths."},
 v:[{ref:"3.35",who:"Krishna",s:"shreyan sva dharmo vigunah para dharmat sv anushthitat / sva dharme nidhanam shreyah para dharmo bhayavahah",i:"śreyān sva dharmo viguṇaḥ para dharmāt sv anuṣṭhitāt / sva dharme nidhanaṃ śreyaḥ para dharmo bhayāvahaḥ",m:"Better your own path, though imperfect, than someone else’s done well. Better to fall on your own path; another’s path is full of danger."},
    {ref:"18.48",who:"Krishna",s:"saha jam karma kaunteya sa dosham api na tyajet / sarvarambha hi doshena dhumenagnir ivavritah",i:"saha jaṃ karma kaunteya sa doṣam api na tyajet / sarvārambhā hi doṣeṇa dhūmenāgnir ivāvṛtāḥ",m:"Don’t give up your own work even if it has faults; every undertaking has some fault, as fire has smoke."}],
 st:["Krishna says it twice: here and again near the end (18.47). And 18.48 adds the comforting part: every undertaking has flaws, “as fire is covered by smoke.” Your path won’t be clean either.","An honest note: some traditions read svadharma as duties fixed by birth (caste). Gandhi re-read it as your qualities and work; Ambedkar criticised the text for supporting caste. In this course, svadharma means your own responsibilities and strengths, never your birth."],
 rule:"Better your own path done imperfectly than someone else’s done well.",
 tr:{s:"A friend got into a quant firm. Your parents ask why you don’t “do what he did”. You’d rather work on EV drivetrains.",q:"The 3.35 view?",o:["Switch to quant; it worked for him","Keep building toward EV drivetrains, borrowing useful skills from his path","Ignore your parents completely","Do nothing until you’re sure"],a:1,w:"You can borrow skills from his path without swapping your direction. Your drive is part of your edge."},
 wy:{q:"Why is your own path, imperfect, the better bet?",o:["You keep going when it’s hard, because the drive is yours","Because your path is guaranteed to succeed","Because copying is morally wrong"],a:0,f:"Motivation you own outlasts motivation you borrow."},
 pl:{i:["I feel pressure to copy someone’s path","I compare my progress to a friend’s","I doubt my own interests"],t:["write 3 things I’m good at and enjoy","spend 30 minutes on my own project today","ask what I can borrow from their path, not swap"]},
 cards:[["Gita 3.35 · Better your own path ___ than another’s ___.","…though imperfect… done well. Svadharma = your own responsibilities and strengths."],["Gita 18.48 · The image that says every path has flaws?","Fire is covered by smoke: every undertaking has some fault."]],
 sl:"Your path doesn’t need to look like anyone else’s to be the right one."},

{id:"g14",t:"Clarity, drive, inertia",
 scene:"Three moods from your week. Sunday morning: calm and clear, you planned the week in 10 minutes. Tuesday: restless, you opened six things, finished none, and bought shoes you didn’t need. Thursday night: heavy, three hours of scrolling in bed.",
 q:"Which mood is worst for getting real work done?",
 o:["Sunday’s calm clarity","Tuesday’s restless drive","Thursday’s heavy inertia","They’re all equally good"],a:2,
 rv:"The Gita calls these the three guṇas: sattva (clarity), rajas (restless drive) and tamas (heaviness). Rajas at least moves; tamas stalls everything, including the will to change. Knowing which one you’re in tells you the fix.",
 pic:{k:"three",top:"The three guṇas",items:["Sattva: clarity","Rajas: drive","Tamas: inertia"]},
 term:{w:"Guṇa",g:"“strand, quality”: the three modes everyone moves between."},
 v:[{ref:"14.8",who:"Krishna",s:"tamas tv ajnana jam viddhi mohanam sarva dehinam / pramadalasya nidrabhis tan nibadhnati bharata",i:"tamas tv ajñāna jaṃ viddhi mohanaṃ sarva dehinām / pramādālasya nidrābhis tan nibadhnāti bhārata",m:"Know tamas as born of ignorance, clouding everyone. It binds through carelessness, laziness and sleep."},
    {ref:"18.28",who:"Krishna",s:"ayuktah prakritah stabdhah shatho naishkritiko 'lasah / vishadi dirgha sutri cha karta tamasa uchyate",i:"ayuktaḥ prākṛtaḥ stabdhaḥ śaṭho naiṣkṛtiko 'lasaḥ / viṣādī dīrgha sūtrī ca kartā tāmasa ucyate",m:"The worker who is undisciplined, crude, stubborn, deceitful, malicious, lazy, gloomy and procrastinating is called tamasic."}],
 st:["14.6–7 describe the other two. Sattva is clear and light, but even it can bind you, to comfort. Rajas comes from craving and binds you to endless doing. Every mode has a trap.","18.28 describes the tamasic worker, ending with dīrgha-sūtrī, literally “long-threaded”: the procrastinator who stretches a one-hour job into a week. 18.26 describes the opposite: steady, enthusiastic, unchanged by success or failure."],
 rule:"Name your mode, then pick the fix: tamas needs movement, rajas needs focus, sattva needs action.",
 tr:{s:"11 pm. You feel heavy and foggy and have been lying on your bed for an hour.",q:"The tamas fix?",o:["Keep scrolling until motivation shows up","Get up, splash water on your face, then do one tiny task or go to sleep properly","Start a big new project","Energy drink and an all-nighter"],a:1,w:"Tamas breaks with movement, not thinking. Do one small thing or commit to real sleep. Lying in between is the worst of both."},
 wy:{q:"Why does naming your mode help?",o:["Each mode needs a different fix: movement for tamas, focus for rajas","Naming something makes it disappear","Sattva is the only mode that matters"],a:0,f:"You wouldn’t fix a jammed gear and a slipping belt the same way."},
 pl:{i:["I’ve been lying around scrolling for 20 minutes","I’m restless and opening many things","I feel clear and calm"],t:["stand up and do one 5-minute task","close everything but one task","start the hardest task right now"]},
 cards:[["Gita 14.6–8 · The three guṇas in plain words?","Sattva = clarity, rajas = restless drive, tamas = heaviness or inertia."],["Gita 18.28 · What does dīrgha-sūtrī describe?","The procrastinator: “long-threaded”, stretching a short job out forever."]],
 sl:"If you feel tamas right now, the right move is real sleep, not more scrolling."},

{id:"g15",t:"Poison first, nectar later",
 scene:"9 pm, two options. A: an hour of fluid mechanics, which feels awful for the first 15 minutes. B: reels, which feel great for the first 15 minutes. Now picture how each one feels at 1 am.",
 q:"Which pattern describes reels?",
 o:["Bad at first, good at the end","Good at first, bad at the end","Good throughout","Bad throughout"],a:1,
 rv:"Krishna sorts pleasures by their shape over time. The best kind feels like poison at first and nectar at the end. The passion kind is nectar at first and poison at the end. Reels at 1 am are the second shape.",
 pic:{k:"curves",a:"Study, exercise",b:"Reels at 1 am"},
 term:{w:"Viṣam iva · amṛtopamam",g:"“like poison” · “like nectar”."},
 v:[{ref:"18.37",who:"Krishna",s:"yat tad agre visham iva pariname 'mritopamam / tat sukham sattvikam proktam atma buddhi prasada jam",i:"yat tad agre viṣam iva pariṇāme 'mṛtopamam / tat sukhaṃ sāttvikaṃ proktam ātma buddhi prasāda jam",m:"What is like poison at first but like nectar in the end, born of a clear mind: that happiness is called sattvic."},
    {ref:"18.38",who:"Krishna",s:"vishayendriya samyogad yat tad agre 'mritopamam / pariname visham iva tat sukham rajasam smritam",i:"viṣayendriya saṃyogād yat tad agre 'mṛtopamam / pariṇāme viṣam iva tat sukhaṃ rājasaṃ smṛtam",m:"What comes from the senses meeting their objects, like nectar at first but like poison in the end: that happiness is called rajasic."}],
 st:["This is the Gita’s version of delayed gratification, long before any psychology lab. The trick is to judge a pleasure by the end of its curve, not the start.","Reels are engineered by large teams to make the first 15 seconds feel like nectar. 18.37 is an old field guide to looking past those 15 seconds."],
 rule:"Judge an activity by how you’ll feel at the end, not at the start.",
 tr:{s:"Friends want a midnight Maggi run before your 9 am exam. It sounds amazing.",q:"The 18.37 check?",o:["Go; it feels great right now","Picture 9 am, tired and foggy. Take a short walk with them now and sleep by 12","Go and stay out till 3","Say yes, then feel guilty"],a:1,w:"Playing the clip to the end (9 am, foggy exam) reveals the poison in the nectar. A shorter fun option keeps both."},
 wy:{q:"How do you spot a “nectar first, poison later” pleasure?",o:["Fast-forward to how you’ll feel after: if it’s worse than now, it’s that shape","If it’s fun, it’s always bad","If it’s hard, it’s always good"],a:0,f:"Not all fun is poison. Just check the end of the curve."},
 pl:{i:["I reach for reels at night","I’m tempted to skip something hard","I’m choosing what to do after dinner"],t:["picture how I’ll feel at 1 am, then choose","do 15 minutes of the hard thing first","pick the option that feels better at the end"]},
 cards:[["Gita 18.37 · The best happiness feels like ___ at first and ___ at the end.","Poison… nectar. (18.38: the passion kind is nectar first, poison later.)"],["Quick test for any pleasure, from Gita 18.37–38?","Fast-forward: judge it by how you’ll feel at the end, not at the start."]],
 sl:"You’re choosing the nectar-later shape right now by putting the phone down."},

{id:"g16",t:"Speak to help",
 scene:"Class group chat. Someone posts a wrong answer to the assignment, totally confident. You know it’s wrong. Your draft reply: “LOL bro did you even attend class 💀”.",
 q:"Best reply?",
 o:["Send it; it’s funny and true","“I think Q3 is different: the flow is turbulent, so use the Moody chart. Happy to share my steps.”","Say nothing and let everyone copy the wrong answer","DM everyone else that he’s dumb"],a:1,
 rv:"The Gita’s test for speech: true, pleasant and helpful, and not stirring up needless agitation. Your draft was true but neither kind nor helpful. The rewrite is all three.",
 pic:{k:"three",top:"Words worth saying",items:["True","Kind","Helpful"]},
 term:{w:"Vāṅmaya tapas",g:"“discipline of speech”."},
 v:[{ref:"17.15",who:"Krishna",s:"anudvega karam vakyam satyam priya hitam cha yat / svadhyayabhyasanam chaiva van mayam tapa uchyate",i:"anudvega karaṃ vākyaṃ satyaṃ priya hitaṃ ca yat / svādhyāyābhyasanaṃ caiva vāṅ mayaṃ tapa ucyate",m:"Words that don’t stir up agitation, that are true, pleasant and helpful, along with regular study: this is called discipline of speech."},
    {ref:"17.16",who:"Krishna",s:"manah prasadah saumyatvam maunam atma vinigrahah / bhava samshuddhir ity etat tapo manasam uchyate",i:"manaḥ prasādaḥ saumyatvaṃ maunam ātma vinigrahaḥ / bhāva saṃśuddhir ity etat tapo mānasam ucyate",m:"A calm mind, gentleness, silence, self-control, clean intentions: this is called discipline of the mind."}],
 st:["Notice the Gita calls this tapas, usually “austerity”: fasting, hard practice. Choosing your words is filed under the same heading as physical discipline.","17.16 adds the inner version: calm, gentleness, silence, self-control. Sometimes the best speech is a pause, which echoes Greene’s Law 4, “say less”. Different books, same move."],
 rule:"Before you speak or send: is it true, kind and helpful? If not, edit it or skip it.",
 tr:{s:"Your roommate’s code broke the night before a deadline. He asks, “Is my code that bad?”",q:"The 17.15 answer?",o:["“Honestly, yes, it’s a mess.”","“The logic is fine; the loop bound is off by one. Let’s fix it together.”","“It’s perfect; the compiler is wrong.”","Say nothing"],a:1,w:"True (there’s a bug), kind (the logic is fine), helpful (here’s the fix). Flattery isn’t true, and bluntness isn’t helpful."},
 wy:{q:"Why isn’t “true” enough on its own?",o:["True words that hurt or don’t help usually close people off, so the truth doesn’t land","Because lying is sometimes better","Because kindness matters more than truth"],a:0,f:"True is the floor, not the ceiling. Kind and helpful are how it actually gets heard."},
 pl:{i:["I’m about to send a sarcastic reply","I need to point out someone’s mistake","I’m typing while angry"],t:["check true / kind / helpful before sending","start with what’s right, then give the fix","wait 10 minutes and reread it"]},
 cards:[["Gita 17.15 · The tests for speech?","True, pleasant and helpful, and not stirring up needless agitation."],["Gita 17.16 · Discipline of the mind includes…","calm, gentleness, silence, self-control, clean intentions."]],
 sl:"Tomorrow, one message can pass the true-kind-helpful test."},

{id:"g17",t:"Three gates",
 scene:"One evening: you buy a ₹2,500 hoodie on impulse. A senior’s comment makes you snap at your roommate. A tip in the trading group pulls you into an options trade bigger than your own rule allows. Each felt reasonable at the time.",
 q:"What do all three have in common?",
 o:["Bad luck","A strong pull that skipped your judgement","Other people’s fault","Nothing; they’re unrelated"],a:1,
 rv:"The Gita names these three exactly: kāma (craving), krodha (anger) and lobha (greed). It calls them gates because each opens fast, lets you through before you think, and leads somewhere you didn’t plan to go.",
 pic:{k:"three",top:"Three gates",items:["Craving (kāma)","Anger (krodha)","Greed (lobha)"]},
 term:{w:"Kāma · krodha · lobha",g:"craving · anger · greed."},
 v:[{ref:"16.21",who:"Krishna",s:"tri vidham narakasyedam dvaram nashanam atmanah / kamah krodhas tatha lobhas tasmad etat trayam tyajet",i:"tri vidhaṃ narakasyedaṃ dvāraṃ nāśanam ātmanaḥ / kāmaḥ krodhas tathā lobhas tasmād etat trayaṃ tyajet",m:"Desire, anger and greed: these three are the gate to hell that ruins the self. So give up these three."},
    {ref:"3.37",who:"Krishna",s:"kama esha krodha esha rajo guna samudbhavah / mahashano maha papma viddhyenam iha vairinam",i:"kāma eṣa krodha eṣa rajo guṇa samudbhavaḥ / mahāśano mahā pāpmā viddhyenam iha vairiṇam",m:"It is desire, it is anger, born of rajas: all-devouring and very harmful. Know this as the enemy here."}],
 st:["In 3.36 Arjuna asks why people do wrong even when they don’t want to. Krishna answers in 3.37: “It is desire, it is anger,” all-devouring. The enemy isn’t other people; it’s these pulls inside.","“Hell” can be read as any self-made mess: debt, a broken friendship, a blown trading account. The practical move: learn to feel the gate opening and put a delay in front of it."],
 rule:"When craving, anger or greed spikes, put a delay between the pull and the action.",
 tr:{s:"Your stock fell 8% and you feel the urge to “average down” with money you set aside for fees.",q:"Which gate, and what’s the delay?",o:["None; buy more now","Greed and fear pulling: sleep on it and reread your written rules first","Anger: message the analyst","Craving: buy something to feel better"],a:1,w:"Breaking your own rule under a strong pull is the gate opening. A 24-hour delay plus your written rules let judgement back in."},
 wy:{q:"Why call them gates?",o:["They open fast and take you somewhere before you’ve thought about it","Because they’re physical doors","Because they’re always locked"],a:0,f:"A gate is a fast way through. The fix is a turnstile in front of it: a delay."},
 pl:{i:["I want to buy something over ₹1,000 on impulse","I feel anger rising mid-conversation","I want to break one of my trading rules"],t:["add it to cart and wait 24 hours","say “give me a minute” and step away","reread my rules and sleep on it"]},
 cards:[["Gita 16.21 · The three gates?","Kama (craving), krodha (anger), lobha (greed). They open fast; add a delay."],["Gita 3.37 · What does Krishna name as the real enemy?","Desire and anger, born of rajas: the pulls inside, not people outside."]],
 sl:"No gate needs opening tonight. Everything can wait till morning."},

{id:"g18",t:"Lotus leaf",
 scene:"Your hostel wing: some bunk every class, the group chat runs on gossip, the hangouts go till 3 am. You like these people. Some friends warn you’ll “become like them”; others say you think you’re “too good” when you skip the 3 am sessions.",
 q:"Best way to handle it?",
 o:["Cut them all off","Join in fully so you fit in","Stay friendly and present, but keep your own habits","Lecture them about their habits"],a:2,
 rv:"The Gita’s image is a lotus leaf: it lives in water, but the water doesn’t stick to it. You can be fully part of the group and still not absorb what you don’t want.",
 pic:{k:"ring",center:"You",outer:["Gossip","3 am hangouts","Bunking","Peer pressure"],shell:"In it, not stained"},
 term:{w:"Padma-patram ivāmbhasā",g:"“like a lotus leaf in water”."},
 v:[{ref:"5.10",who:"Krishna",s:"brahmanyadhaya karmani sangam tyaktva karoti yah / lipyate na sa papena padma patram ivambhasa",i:"brahmaṇyādhāya karmāṇi saṅgaṃ tyaktvā karoti yaḥ / lipyate na sa pāpena padma patram ivāmbhasā",m:"Whoever acts without clinging, offering the work to the highest, isn’t stained by wrong, just as a lotus leaf isn’t wetted by water."},
    {ref:"12.15",who:"Krishna",s:"yasman nodvijate loko lokan nodvijate cha yah / harshamarsha bhayodvegair mukto yah sa cha me priyah",i:"yasmān nodvijate loko lokān nodvijate ca yaḥ / harṣāmarṣa bhayodvegair mukto yaḥ sa ca me priyaḥ",m:"One the world doesn’t shrink from, and who doesn’t shrink from the world, free of elation, envy, fear and anxiety, is dear to me."}],
 st:["These two verses are devotional: 5.10 talks about offering your work to Brahman, the highest reality. A secular reading still works: act without clinging, and the mess around you doesn’t stick.","12.15 describes the same person socially: someone people don’t shrink from, and who doesn’t shrink from people. Not a hermit, not a sponge."],
 rule:"Be fully present with people without absorbing what you don’t want.",
 tr:{s:"At a family wedding in Rajkot, relatives start gossiping about a cousin and ask your opinion.",q:"Lotus-leaf move?",o:["Join the gossip to fit in","Leave the wedding","Stay warm, say “I don’t really know their side,” and change the topic","Lecture everyone about gossip"],a:2,w:"You stay part of the gathering without the gossip sticking to you. Lecturing would make you the next topic."},
 wy:{q:"Why is the lotus leaf better than cutting people off?",o:["You keep the relationships and your habits; neither has to go","People never influence you anyway","Cutting people off is always wrong"],a:0,f:"The leaf doesn’t leave the pond. It just stays dry."},
 pl:{i:["friends pull me into something I don’t want","gossip starts around me","I feel pressure to fit in"],t:["stay warm and say “I’ll pass on this one”","change the topic to something real","join the fun part and leave before the part I don’t want"]},
 cards:[["Gita 5.10 · The image for acting without being stained?","A lotus leaf in water: in it, but the water doesn’t stick."],["Gita 12.15 · Who is dear to Krishna, socially?","One the world doesn’t shrink from, and who doesn’t shrink from the world."]],
 sl:"You can love your people and still keep your own shape."},

{id:"g19",t:"Think it through, then decide",bonus:true,
 scene:"Final year is a year away: job, master’s abroad, or your own startup. Your parents want one thing, your mentor another, your friends a third. Everyone is sure.",
 q:"How does the Gita end its own advice?",
 o:["“Do exactly what I told you.”","“Reflect on all of this fully, then do as you wish.”","“Follow your parents.”","“Wait for a sign.”"],a:1,
 rv:"After hundreds of verses, Krishna hands the decision back: “Reflect on it fully, then do as you wish.” The teacher’s last move is trusting the student.",
 pic:{k:"chain",steps:["Ask good questions","Hear people out","Reflect fully","Decide, and own it"],hi:3},
 term:{w:"Vimṛśya",g:"“having reflected thoroughly”."},
 v:[{ref:"18.63",who:"Krishna",s:"iti te jnanam akhyatam guhyad guhyataram maya / vimrishyaitad asheshena yathecchasi tatha kuru",i:"iti te jñānam ākhyātaṃ guhyād guhyataraṃ mayā / vimṛśyaitad aśeṣeṇa yathecchasi tathā kuru",m:"So I’ve told you this wisdom, the deepest of secrets. Reflect on it fully, then do as you wish."},
    {ref:"4.34",who:"Krishna",s:"tad viddhi pranipatena pariprashnena sevaya / upadekshyanti te jnanam jnaninas tattva darshinah",i:"tad viddhi praṇipātena paripraśnena sevayā / upadekṣyanti te jñānaṃ jñāninas tattva darśinaḥ",m:"Learn it by approaching humbly, by asking thorough questions, and by serving. Those who have seen the truth will teach you."}],
 st:["In 4.34 Krishna describes how to learn: approach humbly, ask thorough questions (paripraśna), serve. Questioning isn’t disrespect in the Gita; it’s the method.","There is a verse, 4.40, that says “the doubter perishes”. Read next to 4.34 and 18.63, it means paralysing doubt that never decides, not questioning. Question fully, then commit."],
 rule:"Ask, listen, reflect fully, then decide and own it.",
 tr:{s:"Your parents want you to take a PSU job; you want to try a startup for two years.",q:"The 18.63 approach?",o:["Do what they say to avoid conflict","Ignore them; it’s your life","Hear their reasons fully, test your plan, then decide and own the choice","Postpone forever"],a:2,w:"Reflecting fully includes their concerns. Deciding yourself means owning the result either way."},
 wy:{q:"Why does 18.63 matter for this whole course?",o:["These lessons are tools to test on yourself, not rules to obey","It says the Gita is optional","It tells you to ignore all advice"],a:0,f:"That’s the spirit of the course: try each idea on yourself and keep what works."},
 pl:{i:["I face a big decision","everyone is telling me what to do","I’m stuck between options"],t:["write each option’s best and worst case","ask the person I disagree with for their best reason","set a date to decide, and stick to it"]},
 cards:[["Gita 18.63 · How does Krishna end his teaching?","“Reflect on it fully, then do as you wish.” The decision goes back to Arjuna."],["Gita 4.34 · Three ways to learn from the wise?","Humble approach, thorough questioning (pariprashna), and service."]],
 sl:"Big decisions don’t need to be made tonight. Reflection works better rested."}
];

/* Charaka: What Still Holds Up. References use Charak Samhita New Edition numbering (carakasamhitaonline.com);
   lines are our own paraphrases. Each lesson grades the claim against modern research.
   Lesson schema (both courses):
   id, t title, scene, q, o[], a, rv reveal, pic {k:...}, term {w,g},
   v[] verses {ref,who,s simple,i IAST,m meaning,n note}  (Gita)  |  src {ref,line,s?,n?}, grade {g,n?}, sci  (Charaka)
   par modern parallel (optional), st[2] story beats, rule, tr transfer {s,q,o,a,w}, wy why {q,o,a,f},
   pl plan {i:[if cues], t:[then actions]}, cards [[front,back],[front,back]], sl sleep thought */
const CHARAKA=[
{id:"c1",t:"Three pillars",
 scene:"Your friend Harsh asks, “What actually matters for health? Gym? Protein? Supplements?” He sleeps at 3 am and lives on canteen samosas.",
 q:"Which list did the Charaka Samhita call the three pillars of life?",
 o:["Exercise, medicine, massage","Food, sleep and self-control","Herbs, prayer, fasting","Gym, protein, supplements"],a:1,
 rv:"The text says life stands on three supports: food (āhāra), sleep (svapna) and brahmacharya. Keep these regulated, it says, and you get strength and growth for life. No supplement made the list.",
 pic:{k:"three",top:"A healthy life",items:["Food","Sleep","Self-control"]},
 term:{w:"Trayopastambha",g:"“the three supporting pillars” of life."},
 src:{ref:"Sutrasthana 11.35",line:"Food, sleep and brahmacharya are the three supports of life. Regulated well, they bring strength, complexion and growth throughout life.",n:"Brahmacharya is literally translated “celibacy”. We read it as self-control over indulgence, not as a health prescription."},
 grade:{g:"Strong",n:"for food and sleep; no evidence for the celibacy reading"},
 sci:"Sleep and diet are two of the biggest health levers modern medicine knows. Adults need 7+ hours of sleep a night (American Academy of Sleep Medicine).",
 st:["The Charaka Samhita began as a student’s notes (Agnivesha’s), was revised by Charaka roughly 2,000 years ago, and was completed later by Dridhabala. It’s a medical textbook: diagnosis, diet, daily routine.","It also names the main root of disease: prajñāparādha, the “error of judgement”. Knowing better and doing it anyway. Like knowing you should sleep, and scrolling anyway."],
 rule:"Before any supplement or hack, fix the pillars: what you eat, when you sleep, how you handle indulgence.",
 tr:{s:"Harsh buys a ₹3,000 protein tub but still sleeps at 3 am.",q:"Pillar check?",o:["Good; protein fixes recovery","He’s skipping a pillar, sleep. Fix that before any supplement","He needs a second supplement","Protein can replace sleep"],a:1,w:"No supplement makes up for a missing pillar. Sleep is where recovery actually happens."},
 wy:{q:"Why is prajñāparādha such a useful idea?",o:["It names the gap between knowing and doing, where most health problems start","It means some foods are cursed","It’s the name of a herb"],a:0,f:"The gap between knowing and doing is the real target."},
 pl:{i:["I’m tempted by a health hack or supplement","I plan my day","I notice I’m neglecting a pillar"],t:["ask “which pillar am I skipping?”","fix one pillar first: my sleep time","eat one proper meal at a fixed time"]},
 cards:[["Charaka Su 11.35 · The three pillars of life?","Food (ahara), sleep (svapna) and brahmacharya (self-control)."],["What is prajñāparādha?","“Error of judgement”: knowing better and doing it anyway. The text’s main root of disease."]],
 sl:"Sleep is one of the three pillars. You build it by stopping now."},

{id:"c2",t:"Sleep runs your life",
 scene:"You’ve averaged 5 hours of sleep for two weeks. “I’ll catch up on Sunday. Sleep is just downtime.”",
 q:"What did the Charaka Samhita say depends on sleep?",
 o:["Just energy levels","Happiness and misery, strength and weakness, knowledge and ignorance, even life and death","Only digestion","Nothing important; sleep is rest"],a:1,
 rv:"Su 21.36 lists pairs: happiness and misery, nourishment and wasting, strength and weakness, knowledge and ignorance, life and death all depend on proper or improper sleep. Knowledge is on the list: sleep is when the day’s learning gets stored.",
 pic:{k:"split",l:"Proper sleep",ls:"happiness, strength, knowledge",r:"Poor sleep",rs:"misery, weakness, ignorance",hi:"l"},
 term:{w:"Nidrā",g:"sleep."},
 src:{ref:"Sutrasthana 21.36",line:"Happiness and misery, nourishment and wasting, strength and weakness, fertility and infertility, knowledge and ignorance, life and death all depend on proper or improper sleep."},
 grade:{g:"Strong"},
 sci:"Adults need 7 or more hours a night; 6 or less counts as inadequate (AASM). Sleep also consolidates memory, which is the “knowledge” line.",
 st:["Notice the pairs: every good thing has an opposite tied to bad sleep. The text treats sleep as a switch, not a luxury.","Catching up on Sunday helps a little, but a regular schedule is what the evidence backs. Next lesson: what the text says about night owls."],
 rule:"Treat sleep as a pillar, not leftover time: 7+ hours on most nights.",
 tr:{s:"Exam week. Your plan: study till 3 am every night to “cover more”.",q:"What do Su 21.36 and modern science suggest?",o:["Study till 3, sleep after exams","Stop by midnight and sleep 7 hours, so the studying sticks","Sleep 4 hours and drink coffee","Skip sleep only the night before"],a:1,w:"Knowledge depends on sleep. Hours studied at 2 am that never get stored are wasted hours."},
 wy:{q:"Why does “knowledge and ignorance” in the sleep verse matter so much for you?",o:["Sleep is when learning gets stored, so cutting it undoes study","Sleeping makes you smart instantly","Dreams teach you things"],a:0,f:"Your cards and lessons consolidate while you sleep."},
 pl:{i:["it’s 12:30 am and I’m still studying","I plan to cut sleep for work","I’m on my phone in bed"],t:["stop and sleep: memory needs it","schedule the study earlier instead","put the phone on charge across the room"]},
 cards:[["Charaka Su 21.36 · What depends on proper sleep?","Happiness, nourishment, strength, knowledge, even life (and their opposites with poor sleep)."],["How much sleep do adults need (AASM)?","7 or more hours; 6 or less counts as inadequate."]],
 sl:"Tonight’s sleep is when today’s learning gets saved."},

{id:"c3",t:"The night-owl warning",
 scene:"You’ve been sleeping between 1 and 2 am for months. “I’m used to it now. My body has adjusted.”",
 q:"What does the text say about people who are used to staying up?",
 o:["Once you’re used to it, it’s fine","Even people used to it shouldn’t overdo staying awake at night","Night is the best time to study","Only old people need early sleep"],a:1,
 rv:"Su 7.34 lists things not to overdo even if you’re used to them: exercise, laughing, talking, walking, sex, and staying awake at night. “I’m used to it” doesn’t earn a pass.",
 pic:{k:"stairs",steps:[["Now","1:45"],["+3 days","1:30"],["+6","1:15"],["+9","1:00"],["+12","12:45"],["+15","12:30"]],desc:true,label:"Bedtime, 15 minutes earlier every few days"},
 term:{w:"Night waking",g:"the text’s name for habitually staying up. Su 8.19 lists it, with oversleeping, as something to avoid."},
 src:{ref:"Sutrasthana 7.34 (also 8.19, 21.50)",line:"Exercise, laughing, talking, walking, sex and staying awake at night shouldn’t be overdone, even by those used to them. Staying up at night makes the body dry and rough (21.50)."},
 grade:{g:"Strong",n:"for regular sleep; the “dryness” explanation isn’t supported"},
 sci:"In about 61,000 UK adults, the most regular sleepers had roughly 30% lower risk of death over the study period than the least regular (observational). Regular timing matters, not just hours.",
 st:["The text’s reason is that night waking makes the body “dry and rough”, while day sleep makes it oily and heavy. That’s ancient physiology, not science.","But the conclusion matches modern data: irregular, late sleep is linked to worse outcomes. Right answer, old reasoning. You’ll see that pattern again and again in this course."],
 rule:"Don’t trust “I’m used to it”. Move your bedtime earlier in small steps.",
 tr:{s:"You want to shift from 2 am to midnight.",q:"Best approach?",o:["Sleep at 10 pm tonight","Move 15 minutes earlier every few days, same wake time every day","Stay up all night once to reset","Sleep whenever you feel tired"],a:1,w:"Small steps with a fixed wake time shift your body clock without a fight. Big jumps usually mean lying awake."},
 wy:{q:"The text’s reason (“dryness”) is wrong. Why does the advice survive?",o:["An observation (late sleep harms you) can be right even when the old explanation is wrong","Because ancient texts are always right","It doesn’t; the advice is wrong too"],a:0,f:"Separate the observation from the explanation, and grade each one."},
 pl:{i:["my wind-down alarm goes off","it’s 15 minutes before my target bedtime","I’m tempted to stay up “just tonight”"],t:["plug the phone in across the room","go to bed 15 minutes earlier than usual","keep the same wake-up time all 7 days"]},
 cards:[["Charaka Su 7.34 · What does “I’m used to it” not excuse?","Overdoing night waking (and exercise, talking, laughing, walking, sex), even for those used to it."],["How do you shift a late bedtime?","15 minutes earlier every few days, with the same wake time all 7 days."]],
 sl:"Fifteen minutes earlier tonight is a real win."},

{id:"c4",t:"Phone out of bed",
 scene:"You get into bed at 12:30 to sleep. Phone, “for 5 minutes”. At 1:45 you’re wide awake and annoyed.",
 q:"The text says the senses can be misused three ways: too much, too little, or wrongly. Which is phone-in-bed?",
 o:["Too little use of the senses","Too much and the wrong use: bright, exciting input at the time meant for sleep","Perfect use","It has nothing to do with health"],a:1,
 rv:"Su 11 says each sense can be overused (atiyoga), unused (ayoga) or wrongly used (mithyāyoga). Bright, exciting input at bedtime is overuse and wrong use at once.",
 pic:{k:"three",top:"Three ways to misuse the senses",items:["Too much (atiyoga)","Too little (ayoga)","Wrongly (mithyāyoga)"]},
 term:{w:"Asātmyendriyārtha-saṃyoga",g:"unwholesome contact of the senses with their objects: one of three root causes of disease."},
 src:{ref:"Sutrasthana 11.37–43",line:"Three root causes of disease: unwholesome contact of the senses with their objects, error of judgement, and time. Each sense can be overused, unused or wrongly used.",n:"The text didn’t know about screens; applying it to phones is our extension."},
 grade:{g:"Partial"},
 sci:"Reading on a light-emitting e-reader before bed suppressed melatonin by about 55% and delayed it by over 1.5 hours compared with a printed book (Chang et al., 2014). In 45,202 Norwegian students, each hour of screen use in bed was linked to 59% higher odds of insomnia.",
 st:["The second root cause in the same list is prajñāparādha, error of judgement. You know the phone keeps you up; you pick it up anyway. Two root causes in one habit.","The fix the text points to is changing the contact. If the phone isn’t reachable, there’s nothing to misuse."],
 rule:"Charge the phone out of arm’s reach before you get into bed.",
 tr:{s:"Your phone is your alarm, so it “has to” be by the bed.",q:"Best fix?",o:["Keep it by the bed and promise not to use it","Put it across the room as the alarm; you’ll have to get up to stop it","Sleep with it under the pillow","Turn the brightness down and keep scrolling"],a:1,w:"Out of reach removes the temptation and gets you up in the morning. Promises made at 12:30 am don’t hold."},
 wy:{q:"Why does distance beat willpower here?",o:["At bedtime your judgement is weakest, so remove the contact instead of resisting it","Because phones emit radiation","Because willpower is strongest at night"],a:0,f:"Same as the Gita’s tortoise: pull the limb in before the pull starts."},
 pl:{i:["I get into bed","it’s 30 minutes before bedtime","I wake up in the night"],t:["the phone charges across the room","switch the phone to grayscale and leave it","don’t check the phone; turn over and breathe slowly"]},
 cards:[["Charaka Su 11 · Three ways to misuse the senses?","Overuse (atiyoga), non-use (ayoga), wrong use (mithyayoga)."],["What did screen light before bed do (Chang 2014)?","Suppressed melatonin about 55% and delayed it by 1.5+ hours."]],
 sl:"Where is your phone charging tonight? Across the room is the answer."},

{id:"c5",t:"Short naps",
 scene:"After lunch you crash for two and a half hours. You wake up groggy at 5, can’t sleep till 3 am, and the cycle repeats.",
 q:"What does the text say about sleeping in the day?",
 o:["Sleep as much as you like in the day","It’s fine when exhausted, for the weak, children and the elderly, and in summer; otherwise avoid it","Never, under any condition","Day sleep is better than night sleep"],a:1,
 rv:"Su 21.39–45 allows day sleep in specific cases: the exhausted, children, the old, the weak, and everyone in summer. Otherwise it advises against it. A two-and-a-half-hour nap that wrecks your night is exactly what it warns about.",
 pic:{k:"meter",zones:["No nap","Short nap (under 1 h)","Long nap"],hi:1,label:"Daytime sleep"},
 term:{w:"Divāsvapna",g:"day sleep."},
 src:{ref:"Sutrasthana 21.39–45",line:"Day sleep suits those worn out by work or travel, the weak, children and the elderly, and everyone in summer. Otherwise it isn’t advised."},
 grade:{g:"Mixed"},
 sci:"Across studies, naps under an hour showed no link with higher mortality; naps of an hour or more did (about 22% higher), possibly because people who are already ill nap more.",
 st:["The summer exception makes sense in Ahmedabad: the text allows day sleep when nights are short and hot.","Your real problem with long naps is the night after. They push bedtime late, which makes the next nap long. Short naps break the loop."],
 rule:"If you nap, keep it under an hour, and before 4 pm.",
 tr:{s:"You’re wiped out after a six-hour lab.",q:"Nap plan?",o:["Sleep till dinner","A 25–40 minute nap with an alarm, then up","Never nap; push through","Nap at 9 pm"],a:1,w:"Exhaustion is one of the text’s allowed cases. A short alarmed nap restores you without wrecking the night."},
 wy:{q:"Why is “Mixed” the honest grade here?",o:["The link between long naps and risk may be caused by illness, not the nap itself","Because naps are always dangerous","Because the text was right about everything"],a:0,f:"In observational data the arrow can point backwards: sick people nap more."},
 pl:{i:["I want to nap","I wake from a nap groggy","it’s after 4 pm and I’m sleepy"],t:["set a 30-minute alarm across the room","get up, wash my face, walk for 5 minutes","push through to an earlier bedtime instead"]},
 cards:[["Charaka Su 21 · When was day sleep allowed?","For the exhausted, the weak, children, the elderly, and everyone in summer; otherwise not advised."],["Safe nap rule?","Under an hour, before 4 pm, with an alarm."]],
 sl:"If you napped long today, tonight’s only goal is the same wake time tomorrow."},

{id:"c6",t:"Leave a third empty",
 scene:"Biryani day at the mess. You go back for a third plate. Afterwards you’re lying flat, too full to study.",
 q:"What’s the Charaka Samhita’s rule for how full to get?",
 o:["Eat until completely full","One-third food, one-third liquid, one-third left empty","Half food, half water","Only liquids after 6 pm"],a:1,
 rv:"Vi 2.3 divides the stomach into thirds: one for solid food, one for liquid, one left empty. And Su 5.7 says heavy foods should only go to a third or half of fullness.",
 pic:{k:"thirds",items:["Food","Liquid","Empty"]},
 term:{w:"Mātrā",g:"the right quantity of food, which the text says depends on your digestion."},
 src:{ref:"Vimanasthana 2.3 (also Sutrasthana 5.7)",line:"Fill a third of the stomach with solids, a third with liquids, and leave a third empty. Eat heavy foods only to a third or half of satisfaction."},
 grade:{g:"Partial",n:"the direction holds; the exact ratio is untested"},
 sci:"In the CALERIE trial, healthy adults who ate about 11–12% less for two years improved heart and metabolic markers. No study has tested “a third empty” itself.",
 st:["Vi 2.6 gives signs you ate the right amount: no pressure in the belly, no heaviness in the chest, you can sit, walk, breathe and talk easily, and hunger and thirst are gone.","Vi 2.9 adds something surprisingly modern: even good food in the right amount isn’t digested well when you’re anxious, angry, grieving or short on sleep."],
 rule:"Stop at “comfortably satisfied”: you could go for a walk right now.",
 tr:{s:"Wedding buffet in Rajkot, 20 dishes.",q:"The third-empty move?",o:["Try everything in full portions","Small tastes of what you want most; stop while you could still walk comfortably","Skip eating","Eat fast before it runs out"],a:1,w:"You get the experience without the crash. Variety in small amounts fits the rule."},
 wy:{q:"Why is “Partial” the right grade?",o:["Eating a bit less is backed by trials, but the exact one-third ratio hasn’t been tested","Because the rule is fully proven","Because eating less is always harmful"],a:0,f:"Trust the direction, not the precise number."},
 pl:{i:["I go for a second plate","I sit down at the mess","I feel heavy after eating"],t:["pause 5 minutes and ask: could I walk easily?","start with a smaller plate","walk for 10 minutes instead of lying down"]},
 cards:[["Charaka Vi 2.3 · How to fill the stomach?","A third food, a third liquid, a third empty."],["Signs you ate the right amount (Vi 2.6)?","No pressure in the belly; easy to sit, walk, breathe and talk; hunger and thirst gone."]],
 sl:"A light dinner tonight means a better night’s sleep."},

{id:"c7",t:"Don’t wolf it down",
 scene:"You eat lunch in six minutes while watching a video, then take a second helping because you “don’t feel full”.",
 q:"Why does the text say eating too fast is a problem?",
 o:["It’s rude","Food can go down the wrong way, and you can’t judge taste or how much you’ve had","It burns more calories","It isn’t a problem"],a:1,
 rv:"Vi 1.25 gives a reason for each eating rule. Too fast: food may go the wrong way, and you can’t judge taste or spot problems with it. Modern research adds that fast eaters eat more.",
 pic:{k:"meter",zones:["Too fast","Calm pace","Very slow"],hi:1,label:"Eating speed"},
 term:{w:"Nātidrutam",g:"“not too fast”."},
 src:{ref:"Vimanasthana 1.24–25",line:"Eat warm food in the right amount, once the last meal is digested, in a pleasant place, not too fast and not too slow, without talking or laughing, with attention. Each rule comes with a reason."},
 grade:{g:"Partial to good"},
 sci:"Across trials, eating more slowly reduced how much people ate (Robinson et al., meta-analysis). In pooled studies, fast eaters had about twice the odds of obesity.",
 st:["The text gives a reason for every rule, which is unusual and very engineer-friendly: warm food digests faster, eating after the last meal is digested means real appetite, attention means you notice what suits you.","One rule in this same verse is contradicted by modern research. You’ll meet it in the last lesson, on what Charaka got wrong."],
 rule:"Put the spoon down between bites.",
 tr:{s:"You have 15 minutes for lunch before a lab.",q:"Best approach?",o:["Inhale it in 4 minutes and scroll","A slightly smaller portion at a calm pace, phone away","Skip lunch","Eat while walking to the lab"],a:1,w:"A calm pace fits in 15 minutes. A smaller portion plus attention means you’re satisfied without the crash."},
 wy:{q:"Why does eating fast lead to eating more?",o:["Fullness signals take time to arrive; eating fast outruns them","Fast food has more calories","It doesn’t"],a:0,f:"Your stomach’s “enough” message arrives late. Slowing down lets it catch up."},
 pl:{i:["I start a meal","I finish my plate and want more","I’m eating alone"],t:["put the spoon down between bites","wait 5 minutes before a second helping","chew each bite a few extra times"]},
 cards:[["Charaka Vi 1.25 · Two reasons not to eat too fast?","Food may go down the wrong way, and you can’t judge taste or quantity."],["Simple trick for eating slower?","Put the spoon down between bites."]],
 sl:"Tomorrow’s first meal: spoon down between bites."},

{id:"c8",t:"Phone-free plate",
 scene:"Dinner in your room with a show on the laptop. Afterwards you can’t remember what you ate, and an hour later you’re snacking.",
 q:"What does the text say about attention while eating?",
 o:["Watch something to relax","Eat with full attention, not while talking or laughing","Eat as fast as possible","Attention doesn’t matter"],a:1,
 rv:"Vi 1.24 says eat “with full attention” and not while talking or laughing. Its reason (1.25): distracted eating has the same faults as eating too fast.",
 pic:{k:"split",l:"Attention on the food",ls:"you notice taste and “enough”",r:"Attention on a screen",rs:"you miss “enough”, snack later",hi:"l"},
 term:{w:"Tanmanā bhuñjīta",g:"“eat with the mind on it”."},
 src:{ref:"Vimanasthana 1.24",line:"Eat without talking or laughing, with your full attention on the meal.",n:"The text even rules out talking. That’s stricter than the evidence needs; screens are the bigger problem."},
 grade:{g:"Partial"},
 sci:"In a recent meta-analysis, passive distraction like TV increased how much people ate during the meal, and also later in the day.",
 st:["Talking and laughing were the “screens” of 2,000 years ago. The text didn’t ban company; it warned about attention leaving the plate.","The “later” part matters: a distracted meal doesn’t register in memory, so you feel hungry again sooner."],
 rule:"One screen-free meal a day.",
 tr:{s:"Mess dinner with friends. Everyone is on their phones.",q:"Practical move?",o:["Join in and scroll too","Suggest phones face-down for dinner, or at least keep yours away","Eat alone in your room with Netflix","Skip dinner"],a:1,w:"Eating with friends and chatting normally is fine. The problem is attention leaving the food entirely; phones down fixes that."},
 wy:{q:"Why do distracted meals lead to snacking later?",o:["The meal doesn’t register as eaten, so you feel hungry sooner","Screens burn calories","It doesn’t happen"],a:0,f:"Remembering the meal is part of feeling full."},
 pl:{i:["I sit down to eat","I reach for my phone at the table","I eat dinner alone"],t:["phone face-down for the whole meal","notice the taste of the first three bites","eat first, then watch the show"]},
 cards:[["Charaka Vi 1.24 · The rule for attention while eating?","Eat with full attention, not while talking or laughing (tanmana bhunjita)."],["What did TV while eating do in studies?","Increased how much people ate during the meal and later."]],
 sl:"Tomorrow: one meal with the phone in your pocket."},

{id:"c9",t:"The late-night Maggi problem",
 scene:"Dinner at 8, study till 12, Maggi at 1 am. You wake up heavy, skip breakfast, eat a huge lunch, and do it all again.",
 q:"Which rule from the text does the 1 am Maggi break?",
 o:["None; a snack is a snack","Eating at the proper time","Never eat spicy food","Never eat alone"],a:1,
 rv:"Su 25.40 ranks eating at proper times as the best thing for wholesome eating, and overeating as the top cause of indigestion. One late meal shifts your whole next day: heavy morning, skipped breakfast, huge lunch, late night again.",
 pic:{k:"cycle",nodes:["1 am meal","Heavy morning","Skip breakfast","Late, big meals"],hi:0},
 term:{w:"Kāla bhojana",g:"“eating at the right time”."},
 src:{ref:"Sutrasthana 25.40 (also Vi 1.24)",line:"From the text’s list of “foremosts”: eating at proper times is foremost for wholesome eating; overeating is the foremost cause of indigestion; eating before the last meal is digested harms digestion."},
 grade:{g:"Partial"},
 sci:"In a lab study of 16 adults, the same meals eaten about 4 hours later raised hunger and slowed calorie burning. A small study, but it points the same way.",
 st:["Su 25.40 is a list of “foremosts”, the single best and worst thing in many categories. A 2,000-year-old top-tips list.","The same list says despondency (viṣāda) is foremost in making illness worse, and contentment is foremost for wellbeing. Mood was part of medicine."],
 rule:"Eat dinner before the late study block, not at 1 am.",
 tr:{s:"You get hungry at midnight while studying.",q:"Better option?",o:["Maggi, every night","Move dinner later (around 9:30) so you’re not starving; if hungry, a fruit or milk","Ignore the hunger and stay up till 3","Order biryani"],a:1,w:"Shift dinner to fit your study schedule and keep anything late small. The real fix is ending the day earlier."},
 wy:{q:"Why does one late meal mess up the whole next day?",o:["It pushes hunger and sleep later, which pushes breakfast out and lunch bigger","Because Maggi is poison","It doesn’t"],a:0,f:"It’s a loop: late meals and late sleep feed each other."},
 pl:{i:["I’m hungry after 11 pm","I plan a late study session","I skip breakfast"],t:["have a fruit or milk, not a full meal","eat dinner right before the study block","eat something small before 10 am"]},
 cards:[["Charaka Su 25.40 · What’s foremost for wholesome eating?","Eating at proper times (kala bhojana). Overeating is the foremost cause of indigestion."],["Late-meal study finding?","The same meals eaten ~4 h later raised hunger and slowed calorie burning (small study)."]],
 sl:"Hungry right now? A glass of milk or a fruit, then sleep."},

{id:"c10",t:"Sweat, breathe, stop",
 scene:"First gym visit in months, and you do everything: two hours, max weights. For the next three days you can barely walk, so you quit.",
 q:"What does the text say about how much to exercise?",
 o:["As hard as possible every time","In moderation, stopping at sweat, faster breathing and a feeling of strain","Only in summer","Never; rest is better"],a:1,
 rv:"Su 7.31 says exercise should be done in moderation. The stop signs: sweating, faster breathing, lightness of body and a sense of strain in the chest. Overdoing it brings exhaustion, thirst and breathlessness (7.33).",
 pic:{k:"meter",zones:["Nothing","Light sweat, faster breath","Wrecked"],hi:1,label:"Exercise effort"},
 term:{w:"Vyāyāma",g:"exercise: body movement for stability and strength."},
 src:{ref:"Sutrasthana 7.31–33",line:"Exercise brings lightness, capacity for work, stability, tolerance of hardship and better digestion. Do it in moderation; overdoing it causes exhaustion, thirst and breathlessness."},
 grade:{g:"Strong",n:"for regular moderate exercise"},
 sci:"WHO advises 150–300 minutes a week of moderate activity plus strength work on 2 or more days. Myth check: “exercise at half your capacity” is often quoted as Charaka, but that line is from the Sushruta Samhita (Chikitsa 24.47). Charaka says “in moderation”.",
 st:["The benefits listed in 7.32 (lightness, capacity for work, steadiness, tolerance of hardship, better digestion) are close to what a sports scientist would list.","For summer the text advises avoiding heavy exercise (Su 6.29), which fits Ahmedabad heat: exercise early or late."],
 rule:"Exercise most days to a light sweat and faster breathing, and stop before you’re wrecked.",
 tr:{s:"You want to start running.",q:"The Su 7 approach?",o:["5 km on day one","10–20 minutes of brisk walk-jog to a light sweat, most days","Wait for winter","Run until you can’t breathe"],a:1,w:"Moderate and regular beats heroic and once. The stop signs keep you able to come back tomorrow."},
 wy:{q:"Why does “moderate” beat “max” for a beginner?",o:["Overdoing it causes soreness and exhaustion that make you quit; consistency is what pays","Max effort is dangerous for everyone, always","Exercise doesn’t help anyway"],a:0,f:"The best workout is the one you’re able to repeat tomorrow."},
 pl:{i:["classes end for the day","I feel restless at night","I’m about to skip exercise"],t:["take a 20-minute brisk walk to a light sweat","do 10 squats and 10 pushups, then stop","walk to the far canteen instead"]},
 cards:[["Charaka Su 7 · Signs to stop exercising?","Sweating, faster breathing, lightness, a sense of strain in the chest."],["Who said “exercise at half your capacity”?","The Sushruta Samhita (Chikitsa 24.47), not Charaka. Charaka says “in moderation”."]],
 sl:"Tomorrow: 20 minutes to a light sweat. That’s the whole plan."},

{id:"c11",t:"Don’t hold it in (body)",
 scene:"Long, quiet lecture. You hold in a sneeze by pinching your nose and shutting your mouth. You’ve also been putting off a bathroom break for an hour.",
 q:"What does the text say about natural urges?",
 o:["Hold them in for good manners","Don’t suppress natural urges like sneezing, urinating, yawning, hunger, thirst and sleep","Only hold in hunger","Urges don’t matter"],a:1,
 rv:"Su 7.3–4 lists 13 urges not to suppress: urine, stool, semen, gas, vomiting, sneezing, belching, yawning, hunger, thirst, tears, sleep, and heavy breathing after exertion.",
 pic:{k:"split",l:"Body urges: let them out",ls:"sneeze, yawn, bathroom, sleep",r:"Mind urges: next lesson",rs:"anger, greed, harsh words",hi:"l"},
 term:{w:"Vega",g:"a natural urge."},
 src:{ref:"Sutrasthana 7.3–4",line:"Don’t suppress the natural urges: urine, stool, semen, gas, vomiting, sneezing, belching, yawning, hunger, thirst, tears, sleep, and heavy breathing after exertion."},
 grade:{g:"Mostly untested"},
 sci:"There’s little research on most of the list. One documented case: a man tore his throat by pinching his nose and mouth shut during a sneeze (BMJ Case Reports, 2018).",
 st:["The chapter’s name, Navegandhāraṇīya, means roughly “on not holding back urges”. It opens the text’s section on daily health.","Ignoring sleepiness is on the list too. When your body says sleep at 11:30 and you push through to 2, that’s suppressing an urge."],
 rule:"Don’t fight your body’s basic signals: sneeze with your mouth open, take the bathroom break, sleep when sleepy.",
 tr:{s:"You feel sleepy at 11:30 pm but want to finish an episode.",q:"The Su 7 view?",o:["Push through; the sleepiness passes","Sleep is one of the 13 urges: go to bed while the wave is there","Drink coffee","Nap at midnight"],a:1,w:"The sleepy wave at 11:30 is your window. Push past it and a second wind often keeps you up till 2."},

function isLate(){ const d=new Date(), hr=d.getHours(), m=d.getMinutes(); return (hr===0&&m>=30)||(hr>=1&&hr<5); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function hashStr(s){ let x=0; for(let i=0;i<s.length;i++) x=(x*31+s.charCodeAt(i))>>>0; return x; }

function defaults(){ return {v:2, ratings:{people:1000,detective:1000}, nAns:{people:0,detective:0}, items:{}, days:{}, rhist:{}, freezes:1, frozen:[], freezeCheck:"", lastEarn:0, freezeNote:"", flags:[], hidden:{}, cases:{}, casesDone:0, decks:0, errors:[], learn:{done:{},last:{},plans:[]}, pzs:{}, pzd:{}}; }
function normalize(p){
  const d=defaults(), o=Object.assign(d,p||{});
  o.ratings=Object.assign({people:1000,detective:1000},(p&&p.ratings)||{});
  o.nAns=Object.assign({people:0,detective:0},(p&&p.nAns)||{});
  for(const k of ["items","days","rhist","hidden","cases","pzs","pzd"]) if(!o[k]||typeof o[k]!=="object"||Array.isArray(o[k])) o[k]={};
  if(!o.learn||typeof o.learn!=="object") o.learn={};
  for(const k of ["done","last"]) if(!o.learn[k]||typeof o.learn[k]!=="object"||Array.isArray(o.learn[k])) o.learn[k]={};
  if(!Array.isArray(o.learn.plans)) o.learn.plans=[];
  for(const k of ["frozen","flags","errors"]) if(!Array.isArray(o[k])) o[k]=[];
  delete o.updatedAt;
  return JSON.parse(JSON.stringify(o));
}

function prune(P){
  const keep=(obj,n)=>{ const ks=Object.keys(obj).sort(); while(ks.length>n) delete obj[ks.shift()]; };
  keep(P.days,150); keep(P.rhist,120); keep(P.pzd,90);
  if(P.learn.plans.length>60) P.learn.plans=P.learn.plans.slice(-60);
  if(P.frozen.length>60) P.frozen=P.frozen.slice(-60);
  if(P.flags.length>80) P.flags=P.flags.slice(-80);

}
function logErr(where,e){ S.P.errors.push({at:new Date().toISOString(),where,code:String((e&&e.code)||(e&&e.message)||e).slice(0,80)}); }
function touch(){ dirty=true; clearTimeout(saveT); saveT=setTimeout(save,1200); }
async function save(){
  if(S.mode!=="live"){ dirty=false; return; }
  if(saving){ saveAgain=true; return; }
  saving=true; saveAgain=false; prune(S.P);
  const body=JSON.parse(JSON.stringify(S.P)); body.updatedAt=new Date().toISOString();
  try{ await db.doc("progress/main").set(body); if(!saveAgain) dirty=false; }
  catch(e){ logErr("save",e); toastOnce("Couldn’t save just now. Retrying."); setTimeout(()=>{ if(dirty) save(); },8000); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; save(); } }
}

/* ---------- ratings, schedule, streak ---------- */
function rate(skill,D,score){
  const P=S.P, R=P.ratings[skill], E=1/(1+Math.pow(10,(D-R)/400)), n=P.nAns[skill]||0, K=n<20?40:24;
  P.ratings[skill]=Math.max(400,Math.min(2400,Math.round(R+K*(score-E)))); P.nAns[skill]=n+1;
  P.rhist[today()]={p:P.ratings.people,d:P.ratings.detective};
  return P.ratings[skill]-R;
}
const IT_INT=[0,21,45,90,180], CARD_INT=[0,1,3,7,14,30,60];
function schedule(id,t,ok){
  const st=S.P.items[id]||{n:0,c:0,b:0}; st.n++; if(ok) st.c++; st.last=today();
  if(t==="mystery"){ st.b=99; st.due="9999-12-31"; }
  else if(ok){ st.b=Math.min((st.b||0)+1,4); st.due=addDays(today(),IT_INT[st.b]); }
  else { st.b=0; st.due=addDays(today(),t==="teaser"?3:2); }
  S.P.items[id]=st;
}
function dayRec(){ const t=today(); return S.P.days[t]||(S.P.days[t]={decks:0,answered:0,correct:0,cards:0,cases:0,lessons:0,puzzles:0}); }
function played(x){ return !!(x&&((x.decks||0)>0||(x.cases||0)>0||(x.lessons||0)>0||(x.puzzles||0)>0||x.legacy)); }
function active(d){ return played(S.P.days[d]) || S.P.frozen.includes(d); }
function streak(){ let d=today(); if(!active(d)) d=addDays(d,-1); let n=0; while(active(d)&&n<2000){ n++; d=addDays(d,-1); } return n; }
function freezeCheck(){
  const P=S.P, t=today(); if(P.freezeCheck===t) return; P.freezeCheck=t; P.freezeNote="";
  if(!active(addDays(t,-1))){
    const gap=[]; let d=addDays(t,-1);
    while(!active(d)&&gap.length<3){ gap.push(d); d=addDays(d,-1); }
    if(active(d)&&gap.length>0&&gap.length<=P.freezes){ P.frozen.push(...gap); P.freezes-=gap.length; P.freezeNote="A streak freeze covered "+(gap.length===1?"yesterday":gap.length+" missed days")+", so your streak is safe."; }
  }
  touch();
}
function learnedLaws(){ const s=new Set(S.cards.map(c=>c.law).filter(l=>LAWS[l])); if(!s.size) Object.keys(LAWS).forEach(k=>s.add(+k)); return [...s].sort((a,b)=>a-b); }
const pool=()=>ITEMS.concat(S.gen);
const findItem=id=>ITEMS_BY_ID[id]||S.gen.find(g=>g.id===id)||null;
const skillOf=t=>(t==="scenario"||t==="spot")?"people":"detective";

/* ---------- decks ---------- */
let D=null;
function buildEntry(it){
  const e={k:"item",id:it.id,t:it.t};
  if(it.t==="spot"){
    let correct, others;
    if(it.kind==="type"){ correct=it.type; others=TYPES.filter(x=>x!==it.type&&!(it.avoid||[]).includes(x)); }
    else { correct=TACTICS[it.law]; const laws=learnedLaws().filter(l=>TACTICS[l]&&l!==it.law); others=(laws.length>=3?laws:Object.keys(TACTICS).map(Number).filter(l=>l!==it.law)).map(l=>TACTICS[l]); }
    e.opts=shuffle([correct].concat(shuffle(others).slice(0,3))); e.a=e.opts.indexOf(correct);
  } else if(it.t==="scenario"){ const ord=shuffle(it.opts.map((_,i)=>i)); e.opts=ord.map(i=>it.opts[i]); e.a=ord.indexOf(it.a); }
  else { e.opts=it.opts.slice(); e.a=it.a; }
  return e;
}
function buildDeck(){
  const t=today(), P=S.P, laws=learnedLaws(), entries=[];
  const due=S.cards.filter(c=>!P.hidden["card:"+c.id]&&(c.due||"")<=t).sort((a,b)=>(a.due||"")<(b.due||"")?-1:(a.due||"")>(b.due||"")?1:((a.law-b.law)||((a.order||0)-(b.order||0))));
  const nRecall=Math.min(due.length>12?4:3,due.length);
  due.slice(0,nRecall).forEach(c=>entries.push({k:"card",id:c.id,t:"recall"}));
  const items=pool().filter(it=>!P.hidden[it.id]&&(!it.law||laws.includes(it.law)));
  const used=new Set();
  const pick=(type,count)=>{
    const R=P.ratings[skillOf(type)], cands=items.filter(it=>it.t===type&&!used.has(it.id));
    const unseen=cands.filter(it=>!P.items[it.id]).map(it=>({it,s:Math.abs((it.d||1000)-R)+Math.random()*160})).sort((a,b)=>a.s-b.s).map(x=>x.it);
    const again=cands.filter(it=>{ const st=P.items[it.id]; return st&&st.b<90&&(st.due||"")<=t; }).sort((a,b)=>P.items[a.id].due<P.items[b.id].due?-1:1);
    const got=unseen.concat(again).slice(0,count); got.forEach(it=>used.add(it.id)); return got;
  };
  const want={scenario:2,spot:2,mystery:1,teaser:nRecall>3?1:2}, chosen=[];
  let short=Math.max(0,3-nRecall);
  for(const type in want){ const got=pick(type,want[type]); chosen.push(...got); short+=want[type]-got.length; }
  for(let g=0; short>0&&g<12; g++){ let added=false; for(const type of ["spot","scenario","teaser","mystery"]){ if(short<=0) break; const more=pick(type,1); if(more.length){ chosen.push(more[0]); short--; added=true; } } if(!added) break; }
  if(short>0){ const seen=items.filter(it=>!used.has(it.id)&&it.t!=="mystery"&&P.items[it.id]).sort((a,b)=>(P.items[a.id].last||"")<(P.items[b.id].last||"")?-1:1).slice(0,short); seen.forEach(it=>{ used.add(it.id); chosen.push(it); }); }
  chosen.forEach(it=>entries.push(buildEntry(it)));
  const rest=shuffle(entries), out=[];
  let fi=rest.findIndex(e=>e.t==="recall"); if(fi<0) fi=rest.findIndex(e=>e.t==="teaser");
  if(fi>=0) out.push(rest.splice(fi,1)[0]);
  while(rest.length){ const prev=out.length?out[out.length-1].t:null; let i=rest.findIndex(e=>e.t!==prev&&!(out.length<2&&e.t==="mystery")); if(i<0) i=0; out.push(rest.splice(i,1)[0]); }
  return out;
}
const cur=()=>D.entries[D.idx];
function startCard(){ const e=cur(); if(!e) return; D.phase=e.t==="recall"?"front":"q"; D.hint=false; D.picked=null; D.flagOpen=false; D.anim=true; }
function newDeck(){ S.resting=false; D={date:today(),entries:buildDeck(),idx:0,results:[],combo:0,best:0,deltas:{people:0,detective:0},reasked:{},completed:false,earned:false}; if(D.entries.length) startCard(); saveDeckLocal(); }
function saveDeckLocal(){ lsSet("pp2.deck",D&&!D.completed?D:null); }
function restoreDeck(){
  const d=lsGet("pp2.deck"); if(!d||d.date!==today()||!Array.isArray(d.entries)||d.completed) return false;
  if(d.results.length>d.idx) d.idx=d.results.length;
  const valid=e=>e.k==="card"?S.cards.some(c=>c.id===e.id):!!findItem(e.id);
  d.entries=d.entries.slice(0,d.idx).concat(d.entries.slice(d.idx).filter(valid));
  if(d.idx>=d.entries.length) return false;
  D=d; startCard(); return true;
}
function answer(i){
  if(!D||D.phase!=="q") return; const e=cur(), it=findItem(e.id); if(!it) return;
  const ok=i===e.a; D.picked=i; D.phase="fb";
  const skill=skillOf(e.t), score=ok?(D.hint?0.6:1):0;
  e.delta=rate(skill,it.d||1000,score); e.skill=skill; D.deltas[skill]+=e.delta;
  schedule(it.id,e.t,ok);
  const r=dayRec(); r.answered++; if(ok) r.correct++;
  D.results.push({id:e.id,t:e.t,ok,picked:i,hint:D.hint});
  D.combo=ok?D.combo+1:0; D.best=Math.max(D.best,D.combo);
  touch(); saveDeckLocal(); renderPlay(true); renderChips();
}
function reveal(){ if(D&&D.phase==="front"){ D.phase="back"; renderPlay(); } }
async function grade(ok){
  if(!D||D.phase!=="back") return; const e=cur(); const c=S.cards.find(x=>x.id===e.id);
  D.results.push({id:e.id,t:"recall",ok}); D.combo=ok?D.combo+1:0; D.best=Math.max(D.best,D.combo);
  if(!ok&&!D.reasked[e.id]&&D.entries.length<13){ D.reasked[e.id]=1; D.entries.push({k:"card",id:e.id,t:"recall",again:true}); }
  next();

    if(S.mode==="live"){ try{ await db.doc("cards/"+c.id).update(patch); }catch(err){ logErr("card",err); toastOnce("That card didn’t save. It’ll come up again."); } } }
}
function next(){ if(!D) return; D.idx++; if(D.idx>=D.entries.length) completeDeck(); else startCard(); saveDeckLocal(); renderPlay(); window.scrollTo({top:0,behavior:"auto"}); }
function completeDeck(){
  if(!D||D.completed) return; D.completed=true; dayRec().decks++; S.P.decks=(S.P.decks||0)+1;
  const s=streak(); if(s>0&&s%7===0&&S.P.lastEarn!==s&&S.P.freezes<2){ S.P.freezes++; S.P.lastEarn=s; D.earned=true; }

}

async function generateFresh(){

/* ----- rule-based conflicts (never compared with the stored answer) ----- */
function latinUnitsFor(p){
  const N=p.N, units=[];
  for(let r=0;r<N;r++) units.push([...Array(N).keys()].map(c=>r*N+c));
  for(let c=0;c<N;c++) units.push([...Array(N).keys()].map(r=>r*N+c));
  if(p.type==="sudoku") for(let br=0;br<N;br+=p.br) for(let bc=0;bc<N;bc+=p.bc){ const u=[]; for(let r=br;r<br+p.br;r++) for(let c=bc;c<bc+p.bc;c++) u.push(r*N+c); units.push(u); }
  return units;
}

  return bad;
}

  if(cg.op==="") return v[0]===cg.target; if(cg.op==="+") return v.reduce((s,x)=>s+x,0)===cg.target; if(cg.op==="×") return v.reduce((s,x)=>s*x,1)===cg.target;

function smConflicts(p,g){

    const lines=[[0,1,2,3,4,5].map(q=>k*6+q),[0,1,2,3,4,5].map(q=>q*6+k)];
    for(const L of lines){
      for(const val of [0,1]){ const cells=L.filter(i=>g[i]===val); if(cells.length>3) cells.forEach(i=>bad.add(i)); }
      for(let q=0;q+2<6;q++){ const a=g[L[q]], b=g[L[q+1]], c=g[L[q+2]]; if(a>=0&&a===b&&b===c){ bad.add(L[q]); bad.add(L[q+1]); bad.add(L[q+2]); } }

}

function pzComplete(p,st){

  if(p.type==="crowns") return st.c.filter(v=>v===2).length===p.N;

  if(p.type==="path") return T.check(p,st.path);

/* ----- hints: fix one wrong thing, else give one safe move ----- */
function pzHint(){

      const units=latinUnitsFor(p), peers=i=>{ const s=new Set(); units.forEach(u=>{ if(u.includes(i)) u.forEach(j=>s.add(j)); }); s.delete(i); return [...s]; };
      let best=99; st.g.forEach((v,i)=>{ if(v) return; const used=new Set(peers(i).map(j=>st.g[j]).filter(Boolean)); const n=N-used.size; if(n<best){ best=n; target=i; } });
    }

    if(target<0){ let best=-1; for(let i=0;i<36;i++){ if(st.g[i]>=0) continue; const r=Math.floor(i/6), cc=i%6; let n=0; for(let q=0;q<6;q++){ if(st.g[r*6+q]>=0) n++; if(st.g[q*6+cc]>=0) n++; } if(n>best){ best=n; target=i; } } }
    if(target<0) return;
    const was=st.g[target]; st.g[target]=p.solution[target]; if(!st.hinted.includes(target)) st.hinted.push(target);
    st.hints++; afterMove(); if(!st.done){ st.msg=was>=0?"Flipped one cell that was wrong.":"Filled one cell for you."; savePz(); renderPuzzles(); }
    return;
  }
  if(p.type==="crowns"){
    const N=p.N, sol=new Set(p.solution.map((col,r)=>r*N+col));

    st.hints++;
    if(wrong>=0){ st.c[wrong]=1; afterMove(); if(!st.done){ st.msg="Removed a crown that can’t be right."; savePz(); renderPuzzles(); } return; }
    const sizes={}; p.region.forEach(r=>sizes[r]=(sizes[r]||0)+1);
    const rows=[...Array(N).keys()].filter(r=>st.c[r*N+p.solution[r]]!==2).sort((a,b)=>sizes[p.region[a*N+p.solution[a]]]-sizes[p.region[b*N+p.solution[b]]]);

  db.collection("cards").onSnapshot(snap=>{ S.cards=snap.docs.map(d=>Object.assign({id:d.id},d.data())); if(!S.cardsLoaded){ S.cardsLoaded=true; maybeReady(); } else if(S.view==="me") renderMe(); },
    e=>{ logErr("cardsSub",e); setStatus("Your cards stopped syncing. Reload the page."); if(!S.cardsLoaded){ S.cardsLoaded=true; maybeReady(); } });
  db.collection("content").onSnapshot(snap=>{ S.gen=snap.docs.map(genFromDoc).filter(Boolean); if(S.ready&&S.view!=="play") rerender(); }, e=>logErr("contentSub",e));
  db.doc("progress/main").onSnapshot(snap=>{
    const remote=snap.exists?snap.data():null;
    if(!S.pLoaded){ S.P=normalize(remote); S.pLoaded=true; maybeReady(); }
    else if(!dirty&&!saving&&remote){ S.P=normalize(remote); renderChips(); if(S.view==="me") renderMe(); else if(S.view==="learn"&&!(LS&&LS.lesson)) renderLearn(); }
  }, e=>{ logErr("progressSub",e); setStatus("Progress stopped syncing. Reload the page."); if(!S.pLoaded){ S.pLoaded=true; maybeReady(); } });
}
if(window.__PP_TEST) window.__pp={S,PZS,get LS(){ return LS; },startLesson,openPuzzle,COURSES,today,latinInput,pzHub};
boot();
