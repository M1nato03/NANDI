name: Android APK

on:
  # Build and publish the app update only after CI (checks + e2e) passed on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the retired 'tools' package, which no longer installs.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      # The Java unit tests (FocusGuardTest, UsedTodayCacheTest) run before any APK is built (Jenil, 29 Oct).
      - name: Java unit tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [[ -n "$ANDROID_KEYSTORE_B64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/nandi-signing.jks"
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            ./gradlew assembleRelease
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo '::warning::Signing secrets are missing. Building a debug APK. Debug APKs from separate runs use different keys and cannot update each other; export a backup before installing another build.'
            ./gradlew assembleDebug
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nandi-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
      # Only main ever reaches the update server: a manual run from any other branch builds the APK and stops here.
      - name: Prepare signed update
        if: env.RELEASE_SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          VERSION_CODE: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p updates-site
          cp "$APK_PATH" "updates-site/nandi-${VERSION_CODE}.apk"
          node updates/prepare.mjs
      - name: Deploy signed update
        if: env.RELEASE_SIGNED == 'true' && github.ref == 'refs/heads/main'
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'Cloudflare token is needed to publish the signed update.' >&2
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN
          # Cloudflare sometimes answers 504 on the asset upload; try up to three times.
          for attempt in 1 2 3; do
            npx wrangler deploy --config updates/wrangler.jsonc && exit 0
            echo "Deploy attempt $attempt did not finish; retrying in 20 s."
            sleep 20
          done
          exit 1
